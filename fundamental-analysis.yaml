glossary:
  types:
    formula: A calculation using defined inputs.
    concept: An idea or relationship that helps explain a business.
    heuristic: A rule of thumb that can guide judgment but may have exceptions.

  fields:
    id: A unique, readable name for the entry.
    type: The entry type; use one of the types defined above.
    description: A plain-language explanation.
    formula: The calculation for a formula entry. Keep it as documentation; code implementations should live in code.
    applies_when: Conditions or comparisons where the entry is useful.
    depends_on: IDs of other entries needed to understand this one.
    source: Where the idea came from, such as a book and page.

  rules:
    required_fields: [id, type, description]
    optional_fields: [formula, applies_when, depends_on, source]
    content_style:
      description: Define one idea, usually in one or two sentences.
      applies_when: Keep use guidance concise; use a literal YAML block with Markdown bullets when several checks or caveats need separate lines.
      entity_granularity: Split only when each resulting idea is independently useful and not already covered by another entry.

entries:
  - id: gross-margin
    type: formula
    description: Share of revenue remaining after subtracting cost of revenue.
    formula: ((revenue - cost_of_revenue) / revenue) * 100
    applies_when: Useful when comparing a company over time or with similar companies; interpretation depends on industry, business model, and how direct costs are classified.

  - id: cost-of-goods-sold
    type: formula
    description: Direct inventory costs recognized as the cost of goods sold; service businesses may report a similar line as cost of revenue.
    formula: beginning_inventory + inventory_costs_added_during_period - ending_inventory
    applies_when: Use this general inventory relationship for goods businesses; inventory costs added may be purchases for a reseller or production costs for a manufacturer. Check the company's classifications, and do not apply the inventory formula to service costs without inventory.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 9."

  - id: gross-profit
    type: formula
    description: Revenue remaining after subtracting the direct cost of goods or services sold, before operating expenses.
    formula: revenue - cost_of_revenue
    applies_when: Use the company's reported cost-of-goods-sold or cost-of-revenue line; its absolute amount is less informative without comparing it with revenue and other periods.
    depends_on: [cost-of-goods-sold, income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 10."

  - id: operating-profit
    type: formula
    description: Profit from operations after subtracting operating expenses such as SG&A, research and development, and depreciation from gross profit, before financing and income-tax items.
    formula: gross_profit - operating_expenses
    applies_when: Use to assess operating results before financing and taxes; verify the company's presentation because expense classifications can vary, and interest is generally shown separately from operating profit.
    depends_on: [gross-profit]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 11."

  - id: sga-to-gross-profit
    type: formula
    description: Selling, general, and administrative expenses as a share of gross profit.
    formula: (selling_general_and_administrative_expense / gross_profit) * 100
    applies_when: Compare the ratio over time and with similar business models to assess how much gross profit SG&A absorbs; when sales fall, check whether SG&A adjusts, since sticky costs can consume a rising share of gross profit. Use only when gross profit is positive and avoid treating a fixed threshold as universal.
    depends_on: [gross-profit]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 12."

  - id: rd-to-gross-profit
    type: formula
    description: Research and development expense as a share of gross profit.
    formula: (research_and_development_expense / gross_profit) * 100
    applies_when: Compare the ratio over time and with similar businesses to assess R&D burden; a high ratio is not inherently bad, so consider whether the spending sustains an advantage and earns adequate returns. Use only when gross profit is positive.
    depends_on: [gross-profit]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 13."

  - id: depreciation-to-gross-profit
    type: formula
    description: Depreciation expense as a share of gross profit.
    formula: (depreciation_expense / gross_profit) * 100
    applies_when: |-
      - Compare over time and with similar asset-intensive businesses; use only when gross profit
        is positive.
      - Depreciation is a noncash allocation in the period recorded, but productive assets
        eventually need replacement, and replacement spending may differ in timing and amount.
      - Changes to useful lives, depreciation methods, or asset values can shift reported
        earnings. A write-down that lowers future depreciation does not by itself improve the
        business. Compare the policy with asset condition and replacement needs.
      - An EBITDA addback does not remove the economic cost of replacing productive assets;
        accumulated depreciation reduces carrying value rather than creating a liability.
    depends_on: [gross-profit]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapter 34; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 14 and 51; Warren E. Buffett, Berkshire Hathaway shareholder letters for 2015, 2016, 2019, 2020, and 2023, discussions of replacement capital and depreciation."

  - id: interest-to-operating-income
    type: formula
    description: Interest expense as a share of operating income; its inverse is an interest-coverage measure.
    formula: (interest_expense / operating_income) * 100
    applies_when: |-
      - Use only when operating income is positive; compare similar industries and business
        models. Financing is part of operations for financial firms, so this ratio may not be
        useful for them.
      - Review results through actual downturns where available and stress-test a prolonged
        decline; peak-year earnings or short averages can hide thin protection. No industry is
        immune to earnings declines, so consider the business's stability and survival prospects.
      - Calibrate the required cushion to earnings volatility and business durability. Past
        coverage may not protect a smaller, unstable issuer through prolonged losses; size is a
        resilience factor, not a substitute for viable economics.
      - For bond safety, supplement this ratio by assessing all fixed claims, issuer size, the
        equity cushion, and asset security where relevant. A high coupon does not establish
        repayment capacity, and Graham’s historical coverage cutoffs are not universal.
    depends_on: [operating-profit]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 15; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 11 and 17; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapters 6-7."

  - id: net-profit-margin
    type: formula
    description: Net earnings remaining as a share of revenue after expenses and income taxes.
    formula: (net_earnings / revenue) * 100
    applies_when: Use when revenue is positive to compare bottom-line profitability over time and with similar businesses; interpret financial companies and other distinct business models in their own context, and do not treat fixed percentage thresholds as universal.
    depends_on: [income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 19."

  - id: earnings-per-share
    type: formula
    description: Net earnings attributable to common shareholders per weighted-average common share for a reporting period.
    formula: net_income_available_to_common_shareholders / weighted_average_common_shares_outstanding
    applies_when: |-
      - Compare basic with basic or diluted with diluted EPS, and separate earnings growth from
        changes in weighted-average shares.
      - When options, warrants, or convertibles could materially increase shares, check diluted
        EPS and the notes; assumed conversion may also change the earnings numerator.
      - Repurchases can raise EPS without earnings growth. Assess their price, funding, and
        whether they offset stock-based compensation or other share issuance.
      - For share-financed acquisitions, compare the value of the business received with the value
        of shares issued; EPS accretion alone does not establish value creation.
      - A lower share count alone does not establish value creation. Use a multi-year trend rather
        than relying on one period.
    depends_on: [income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 20 and 53-54; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 12-13 and 16; Warren E. Buffett, Berkshire Hathaway shareholder letter for 1982, discussion of stock issued in acquisitions."

  - id: price-earnings-ratio
    type: formula
    description: Current share price relative to earnings per common share for a stated period; its inverse is the earnings yield.
    formula: share_price / earnings_per_share
    applies_when: |-
      - Use only with positive EPS and label the basis, such as trailing or normalized multi-year
        earnings. Prefer actual results as a starting point; treat forecasts as uncertain
        scenarios and test them against history and base rates.
      - Compare similar businesses and account for cyclicality, accounting differences, expected
        growth, and risk.
      - A low ratio can reflect deteriorating economics, while a high ratio may already price in
        optimistic expectations; no fixed threshold proves value or predicts returns.
    depends_on: [earnings-per-share]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 3, 11, 13-15, and 17; Jason Zweig, commentary on chapter 14."

  - id: price-to-book-ratio
    type: formula
    description: Market price per common share relative to reported book value per common share.
    formula: market_price_per_share / book_value_per_common_share
    applies_when: Use only when common book value per share is positive, and compare similar businesses using consistent accounting bases. Book value may omit internally developed brands, customer relationships, and other economic assets, while acquisition goodwill can inflate reported equity; asset-light companies and financial institutions need context-specific interpretation. A low ratio may reflect weak asset quality or earning power, while a high ratio needs support from durable earning power; neither establishes value by itself.
    depends_on: [balance-sheet, unrecognized-intangible-value]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 14 and commentary on chapter 14; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapter 42."

  - id: dividend-yield
    type: formula
    description: Annual cash dividends per common share as a percentage of the current share price.
    formula: (annual_dividends_per_share / share_price) * 100
    applies_when: Use a clearly labeled trailing or expected annual dividend and a positive share price. Dividends can be reduced or suspended, and a high yield may result from a falling share price; assess coverage, business condition, and valuation rather than treating yield as guaranteed income or proof of a bargain.
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 3; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part IV, chapter 29."

  - id: dividend-policy-as-cash-flow-signal
    type: heuristic
    description: A dividend change can signal management's view of cash-flow durability and investment needs, but payout policy can lag business conditions or mislead investors.
    applies_when: |-
      - Compare dividends with normalized owner earnings, free cash flow, maintenance needs,
        working capital, and debt obligations; identify whether payouts rely on borrowing,
        asset sales, or new equity rather than recurring cash generation.
      - Treat a dividend increase, unchanged payout, or cut as evidence about management's view,
        not a forecast or guarantee. Boards may maintain dividends after cash generation weakens
        or change them for reasons unrelated to permanent earning power.
      - Do not treat a high yield or stable payout as proof of safety or undervaluation; analyze
        business condition and price separately.
    depends_on: [dividend-yield, owner-earnings]
    source: "Bruce Berkowitz, Introduction to Part IV, in Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008); Benjamin Graham and David Dodd, Part IV, chapter 29."

  - id: earnings-yield-on-original-cost
    type: formula
    description: Current normalized earnings per share as a share of the original per-share purchase price; an earnings comparison on cost, not a contractual or cash yield.
    formula: (current_normalized_earnings_per_share / original_purchase_price_per_share) * 100
    applies_when: Use comparable normalized per-share earnings and the split-adjusted original price; keep pretax or after-tax earnings basis consistent. This shows earnings relative to purchase price, not realized return, cash received, or a promised coupon; earnings can decline and may not be distributed.
    depends_on: [earnings-per-share, normalize-earnings-for-nonrecurring-items]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 53-55."

  - id: effective-tax-rate
    type: formula
    description: Income tax expense as a share of income before tax.
    formula: (income_tax_expense / income_before_tax) * 100
    applies_when: Use when income before tax is positive and review the tax disclosures for context. Income tax expense and cash taxes paid can differ; reconcile unusually low or zero taxes with loss carryforwards, credits, and other disclosed items. A large gap between reported pretax income and income implied by tax accrual is a prompt to investigate, not proof of misstatement. Rates vary with jurisdiction and timing.
    depends_on: [income-before-tax]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapter 33; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 18; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 17."

  - id: net-receivables-to-sales
    type: formula
    description: Net receivables as a share of revenue; net receivables are reported receivables less the allowance for uncollectible accounts.
    formula: (net_receivables / revenue) * 100
    applies_when: |-
      - Use when revenue is positive, align receivables with the same reporting period, and
        compare over time and with similar businesses.
      - A sustained rise relative to sales warrants checking collection speed, customer terms and
        credit quality, revenue timing, acquisitions, and customer mix; it is a signal to
        investigate, not proof of misstatement.
      - Account for seasonality, receivables aging, and the allowance before drawing conclusions.
        A lower ratio may reflect faster collection or less reliance on customer credit.
    depends_on: [balance-sheet, income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 26; Jason Zweig, commentary on chapter 12 in Benjamin Graham, The Intelligent Investor (2003 edition)."

  - id: customer-concentration-risk
    type: concept
    description: A business that relies heavily on one customer or a small group of customers is exposed to lost revenue, weaker bargaining power, and cash-flow disruption if those relationships change.
    applies_when: Assess each major customer's share of revenue, receivables, and operating profit; review contract duration, renewal terms, switching costs, alternatives for replacing lost demand, and customer financial condition. Concentration is not automatically disqualifying when relationships are durable and economics are sound, but growth may be fragile if it depends on a few buyers.
    depends_on: [income-statement, net-receivables-to-sales, durable-competitive-advantage]
    source: "Jason Zweig, commentary on chapter 11 in Benjamin Graham, The Intelligent Investor (2003 edition)."

  - id: customer-financing-risk
    type: heuristic
    description: Loans, extended credit, or guarantees a company provides to its customers can support reported sales while exposing the company to customer default and collection risk.
    applies_when: Review customer loans, receivables, guarantees, and other financing commitments alongside revenue, operating cash flow, and bad-debt provisions. Rapid growth in customer financing may indicate that customers depend on the seller's credit to buy, and can shift credit risk onto the supplier; assess repayment terms, collateral, guarantees, delinquencies, and concentrations. This is a reason to investigate demand quality and credit exposure, not proof that reported sales are improper.
    depends_on: [income-statement, balance-sheet, cash-flow-statement, net-receivables-to-sales]
    source: "Jason Zweig, commentary on chapter 17 in Benjamin Graham, The Intelligent Investor (2003 edition), Lucent Technologies case."

  - id: working-capital
    type: formula
    description: Current assets remaining after current liabilities are subtracted; an absolute measure of short-term balance-sheet coverage.
    formula: current_assets - current_liabilities
    applies_when: |-
      - Interpret with the operating cycle, asset liquidity, liability due dates, cash generation,
        and industry. Negative working capital can be sustainable in some business models, while
        a positive amount does not by itself establish that obligations can be met.
      - For a distressed bond, compare net current assets with funded debt, but require a meaningful
        cushion rather than assuming reported coverage guarantees repayment. Operating losses can
        consume working capital, and receivables or inventory may realize below book value.
      - Distinguish temporary seasonal borrowing that supports profitable orders from debt tied to
        inventory building up in an unprofitable market; compare the balance-sheet trend with
        operating results and upcoming debt maturities.
    depends_on: [balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 28; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part III, chapter 26 and Part VI, chapter 45."

  - id: net-current-asset-value
    type: formula
    description: Estimated current assets remaining for common shareholders after deducting all liabilities and preferred stock; a historical asset-based bargain measure, not a liquidation guarantee.
    formula: (current_assets - total_liabilities - preferred_stock) / diluted_common_shares_outstanding
    applies_when: |-
      - Compare the per-share amount with market price only after reviewing asset quality,
        collectability, obsolescence, off-balance-sheet claims, liquidation costs, and ongoing
        losses. Estimate recovery by asset class: cash may be near face value, while receivables,
        inventory, and fixed assets can require substantial discounts.
      - Graham’s historical approach relied on a substantial discount, a diversified group of
        bargains, and patience; an individual discount does not ensure realization.
      - Current assets can be overstated or consumed before liquidation, and a low price-to-NCAV
        does not make a structurally failing business safe.
      - This measure subtracts all liabilities and preferred stock; working capital subtracts
        current liabilities only.
    depends_on: [balance-sheet, working-capital, portfolio-diversification]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 7 and 15; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapters 42-44."

  - id: current-ratio
    type: formula
    description: Current assets divided by current liabilities, measuring short-term asset coverage on a balance-sheet date.
    formula: current_assets / current_liabilities
    applies_when: Use when current liabilities are positive; compare over time and with similar business models. A ratio below one does not by itself prove distress, and a ratio above one does not guarantee liquidity. Consider due dates, cash generation, and how readily inventory and other current assets can be converted into cash; this is a liquidity measure, not a test of competitive advantage.
    depends_on: [balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 28; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapter 45."

  - id: quick-ratio
    type: formula
    description: Current assets excluding inventory relative to current liabilities, a stricter short-term coverage measure than the current ratio.
    formula: (current_assets - inventory) / current_liabilities
    applies_when: Use when current liabilities are positive; compare over time and with similar business models. Receivables may still be difficult to collect, and some presentations also exclude prepayments or other less-liquid current assets, so state the method used. Seasonality and debt maturities matter, and no fixed threshold establishes adequate liquidity.
    depends_on: [balance-sheet, current-ratio]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapter 45."

  - id: total-liabilities-to-equity
    type: formula
    description: Total liabilities relative to shareholders' equity, a balance-sheet measure of obligations in relation to reported equity.
    formula: total_liabilities / shareholders_equity
    applies_when: This numerator includes all liabilities, not only interest-bearing debt, so label it accordingly. Compare within similar business models; share repurchases can reduce equity and inflate the ratio, while very small or negative equity makes it unstable or uninterpretable. Financial institutions have distinct balance-sheet structures, and no single threshold establishes a durable advantage.
    depends_on: [balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 42."

  - id: return-on-assets
    type: formula
    description: Net earnings generated per dollar of assets, measuring reported asset efficiency over a period.
    formula: (net_earnings / average_total_assets) * 100
    applies_when: Use average total assets where available to align a period's earnings with the assets used to generate them; be consistent if using period-end assets instead. Compare similar business models. A high return does not by itself prove a durable advantage, since capital intensity, asset-light operations, unrecorded intangibles, and accounting choices affect the ratio.
    depends_on: [income-statement, balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 34."

  - id: return-on-equity
    type: formula
    description: Net earnings available to common shareholders as a share of average shareholders' equity attributable to common shares.
    formula: (net_income_available_to_common_shareholders / average_common_shareholders_equity) * 100
    applies_when: Use when average common equity is positive and compare across periods and similar businesses. High ROE can reflect operating strength, leverage, repurchases that shrink equity, a small denominator, or unusual earnings; assess debt, treasury stock, and earnings quality. Negative or near-zero equity makes the ratio misleading, and ROE alone does not prove a durable advantage.
    depends_on: [income-statement, balance-sheet, preferred-stock-priority]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 47-48."

  - id: return-on-invested-capital
    type: formula
    description: After-tax operating profit relative to the average capital committed to the operating business, a measure of operating capital efficiency.
    formula: (net_operating_profit_after_tax / average_invested_capital) * 100
    applies_when: |-
      - Define after-tax operating profit and invested capital consistently; invested capital
        commonly includes operating assets less non-interest-bearing current liabilities and
        excess cash. Use average capital when available and adjust for acquisitions or accounting
        choices.
      - Some practitioners use owner earnings instead of after-tax operating profit. State the
        method and do not compare unlike calculations.
      - Compare similar business models. A high return alone does not prove a durable advantage or
        attractive valuation.
    depends_on: [operating-profit, balance-sheet, owner-earnings]
    source: "Jason Zweig, commentary on chapter 15 in Benjamin Graham, The Intelligent Investor (2003 edition), discussion of return on invested capital and owner earnings."

  - id: capital-expenditure-to-net-earnings
    type: formula
    description: Total capital expenditures as a share of total net earnings over the same multi-year period.
    formula: (sum(capital_expenditures over period) / sum(net_earnings over same period)) * 100
    applies_when: Use a consistent multi-year period (the book uses ten years) and require positive cumulative net earnings. Treat reported capital expenditures as a positive amount even if shown as a cash outflow; compare similar businesses and distinguish maintenance needs from growth investment. This is a reinvestment-burden clue, not a direct measure of maintenance capital or a test with a universal cutoff.
    depends_on: [cash-flow-statement, income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 51."

  - id: owner-earnings
    type: formula
    description: An estimate of the cash a business can generate for owners after meeting the investment needs required to maintain its competitive position and operating volume.
    formula: normalized_net_earnings + depreciation_depletion_amortization_and_other_noncash_charges - maintenance_capital_expenditures - incremental_working_capital_required
    applies_when: |-
      - Estimate maintenance capital spending from what is needed to preserve competitive position
        and operating volume; reported capital expenditures may also include growth investment.
      - Historical-cost depreciation can understate current replacement needs. Compare multi-year
        spending with asset condition and operating requirements.
      - Owner earnings is an estimate, not a reported accounting measure. Adding back a noncash
        charge does not make the related assets costless to maintain.
    depends_on: [income-statement, cash-flow-statement]
    source: "Glenn H. Greenberg, Introduction to Part V, and Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 34; Bruce Berkowitz, Introduction to Part IV, in the same edition; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1986, 2015-2016, 2019-2020, and 2023, discussions of owner earnings, depreciation, and replacement capital."

  - id: net-change-in-cash
    type: formula
    description: Net cash flows from operating, investing, and financing activities summed for a reporting period.
    formula: net_cash_from_operating_activities + net_cash_from_investing_activities + net_cash_from_financing_activities
    applies_when: Use to interpret cash movement, not profitability; borrowing or share issuance can increase cash despite weak operating cash generation. Add separately reported exchange-rate effects when reconciling beginning and ending cash.
    depends_on: [cash-flow-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 50."

  - id: income-statement
    type: concept
    description: A report of a company's revenues, expenses, and profit over a defined period, used to assess profitability, margins, and the level and trend of earnings.
    applies_when: Compare quarterly or annual periods to assess earnings consistency and direction; return on equity also requires equity data from the balance sheet.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 5."

  - id: income-before-tax
    type: concept
    description: Income remaining after expenses and nonoperating items but before income taxes, as presented on the income statement.
    applies_when: Use as the pre-tax earnings base when comparing investments; check the company's presentation because included items may vary.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 17."

  - id: balance-sheet
    type: concept
    description: A point-in-time report of a company's assets, liabilities, and shareholders' equity; book equity is assets minus liabilities, while cash minus debt is net cash.
    applies_when: |-
      - Use it to identify the resources tied up in the business, claims against those resources,
        near-term financial strain, and the capital structure; distinguish net cash from book equity.
      - Compare successive balance sheets to check whether reported earnings agree with changes in
        assets, liabilities, and equity, and to assess whether investment is supporting earning power.
      - Review footnotes and consolidated statements for contingencies, subsidiary obligations,
        noncontrolling interests, and claims senior to common shareholders.
      - Book values are accounting amounts, not automatic estimates of replacement or liquidation
        value. Assess asset quality and the purpose of the valuation separately.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 5 and 41; Bruce Greenwald, Introduction to Part VI, and Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapters 42 and 45."

  - id: preferred-stock-priority
    type: concept
    description: Preferred shares are an equity class whose dividends and claims on assets generally rank ahead of common shares but behind creditors; their usually fixed dividends provide less participation in business growth than common shares.
    applies_when: |-
      - Review dividend, liquidation, voting, conversion, redemption, and cumulative-dividend
        terms before assessing claims on earnings or assets. Preferred dividends can resemble
        debt service economically but may be suspended under issue terms; unlike bond interest,
        they generally do not give the holder the same creditor claim or a maturity date.
      - When bonds or another preferred class rank ahead, assess their combined prior claims.
        Dividend coverage stated per share can overstate protection; also examine the common
        equity cushion below the preferred issue.
      - Check whether the issue participates in common dividends and whether a call or redemption
        can end that participation before it becomes valuable.
      - Compare the issuer's capacity to pay and the issue's protections with bonds and common
        shares; rights and tax treatment vary.
    depends_on: [balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 44; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 4; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapter 15 and Part III, chapter 23."

  - id: convertible-security-analysis
    type: heuristic
    description: A convertible bond or preferred share combines a senior claim with an option to exchange it for common stock; as its price rises with the stock, its risk can become increasingly equity-like.
    applies_when: |-
      - Decide whether the purchase is meant to be a fixed-value investment or a common-stock
        speculation. For an investment, require adequate safety without relying on the privilege;
        do not accept a weak issuer merely for the possibility of conversion.
      - Assess issuer credit, seniority, income, maturity, call terms, and the common stock's value.
        Compare market price with conversion value and premium; assess the extent, closeness, and
        duration of the privilege alongside the business prospects.
      - Read antidilution adjustments, sliding conversion prices, call protection, and any delay
        before conversion becomes available. Antidilution may protect the conversion basis without
        preserving a market premium; block-based increases can pressure early conversion.
      - If bought for investment, consider selling when the issue leaves its investment range
        rather than converting automatically. Conversion gives up seniority; include potential
        shares in diluted per-share analysis and convert only if the common is independently worth
        owning. Graham's suggested 25-35% gain was historical guidance, not a universal target.
    depends_on: [preferred-stock-priority, interest-to-operating-income, earnings-per-share, intrinsic-business-value]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 16 and commentary on chapter 16; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part III, chapters 22-24."

  - id: warrant-bearing-senior-security
    type: heuristic
    description: A bond or preferred share issued with a stock-purchase warrant can preserve the senior claim while giving the holder a separate option to buy common shares.
    applies_when: |-
      - Value the senior security and warrant separately; assess the warrant's share count,
        exercise price, expiration, dilution adjustments, and the issuer's prospects.
      - Check whether the warrant is detachable and survives redemption or a call of the senior
        issue. The warrant can often be sold to realize speculative value while retaining the
        original bond or preferred share.
      - Compare the combined issue price with the value of its components. A warrant does not
        compensate for inadequate safety or make the issuer's common stock attractive by itself.
    depends_on: [preferred-stock-priority, convertible-security-analysis, intrinsic-business-value]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part III, chapters 22-23."

  - id: current-asset-cycle
    type: concept
    description: The operating cycle in which cash is used to acquire inventory, inventory is sold and may become receivables, and customer collection returns the funds to cash.
    applies_when: Use to understand how operating funds move through inventory and receivables and how much capital is tied up while the business completes sales and collects payment. The cycle varies by business model, and some service businesses carry little or no inventory.
    depends_on: [balance-sheet]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 23."

  - id: unrecognized-intangible-value
    type: concept
    description: >-
      Internally developed brands, customer relationships, and other capabilities may create
      economic value that is absent from book assets. When they support returns above those
      available on tangible capital, they constitute economic goodwill distinct from acquisition
      goodwill.
    applies_when: Do not assign an arbitrary value to omitted intangibles; assess their economic contribution through evidence such as customer preference, pricing resilience, margins, cash generation, and high returns on tangible capital over time. Recognition and amortization depend on the asset and accounting framework. Purchased goodwill alone does not establish that an economic franchise exists or that the acquisition price was sound.
    depends_on: [balance-sheet, durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 31; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 14 and commentary on chapter 14; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1983, 2010, 2014, and 2018, discussions of book value, GEICO's economic goodwill, and the limits of book value as Berkshire's business mix changed."

  - id: replacement-value-analysis
    type: concept
    description: Replacement value estimates what it would cost a well-positioned competitor to reproduce a firm's productive net assets; it helps test whether earning power is exposed to competitive entry.
    applies_when: |-
      - Estimate the cost of reproducing relevant productive assets and capacity; do not confuse
        this with reported book value or proceeds from liquidation.
      - Compare earning power with the returns competitors could earn on reproduced assets. Excess
        returns can attract entry unless durable advantages, scarce resources, regulation, or other
        conditions protect them.
      - Include intangible assets only when their reproduction cost can be supported by evidence.
        Replacement value is a competitive-durability check, not a standalone estimate of intrinsic
        value or proof that assets can be reproduced quickly.
    depends_on: [balance-sheet, return-on-invested-capital, durable-competitive-advantage, unrecognized-intangible-value]
    source: "Bruce Greenwald, Introduction to Part VI, in Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008)."

  - id: intrinsic-business-value
    type: concept
    description: The estimated present value of the future cash a business can generate for its owners; it reflects expected cash flows, their timing, and the capital required to produce them rather than the historical accounting amounts accumulated in book value.
    applies_when: |-
      - Estimate sustainable owner cash flows, timing, and required capital, then discount at an
        appropriate rate. Start from normalized multi-year earning power and make evidence-based
        changes for competition, capacity, regulation, or management; distinguish results from
        forecasts. An average is useful only when its years represent relevant conditions and
        results cluster around a meaningful earning level; a wide spread or structural change can
        make the arithmetic average misleading.
      - Treat a rising earnings trend as evidence to investigate, not a forecast to extend
        indefinitely. Test results across business cycles and against competition, industry
        change, and the possibility that growth is maturing. A falling trend also needs diagnosis:
        determine whether its causes are temporary or lasting before rejecting the past record.
      - Use a range, base rates, and probability-weighted scenarios rather than false precision.
        If value cannot be estimated within a useful range, treat the valuation as speculative.
      - For distinct segments, estimate each using suitable economics, then subtract central
        costs, debt, taxes, and other claims; a sum-of-parts estimate is not automatic breakup
        value. Separate income streams by source and underlying asset, and assess their risk,
        duration, and capital needs before applying a common valuation basis.
      - For finite-lived resources or projects, test reserve quality, output, unit costs, royalties,
        and required investment. Historical earnings from a different asset or operating setup
        may not indicate the new project's earning power.
      - Growth adds value only when expected returns justify the required investment. Assess how
        management is likely to use retained earnings.
      - Book value is not a substitute for earning power. Compare intrinsic value with market
        price, not with a supposedly precise observable figure.
    depends_on: [owner-earnings]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 1 and Part V, chapters 37-41; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 11; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1983, 1990, 1993, 2000, 2009-2010, 2014, 2018, 2020, and 2023, discussions of intrinsic value, cash-flow timing, valuation uncertainty, future capital allocation, and the limits of book value; Charlie Munger, 'The Psychology of Human Misjudgment' (1995), discussion of base rates and probability."

  - id: cash-flow-statement
    type: concept
    description: A report of cash inflows and outflows over a period, commonly grouped into operating, investing, and financing activities; accrual-based earnings can differ from cash collected and paid.
    applies_when: Compare cash flows with reported earnings and use several years of statements to distinguish recurring operating cash from proceeds from borrowing, share issuance, or asset and business sales. Read the three activity sections separately and together; review capital spending, acquisitions, debt repayment, share repurchases, and dividends. A positive net change in cash or a large cash balance alone does not establish profitable operations or business strength.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 5 and 50."

  - id: primary-filings-for-financial-analysis
    type: heuristic
    description: Financial-data services can make statements easier to find, while official regulatory filings provide the company's underlying disclosures and context for analysis.
    applies_when: |-
      - Use data services for convenience, then verify figures in primary disclosures. Review
        several years of statements, management discussion, accounting notes, and proxy materials
        on ownership, compensation, conflicts, and shareholder rights.
      - Compare disclosures with close competitors. Read relevant security documents, such as bond
        indentures, charters, and prospectuses; consult industry or regulatory records for
        material operating detail.
      - Ask the company legitimate follow-up questions when important facts remain unclear. Treat
        material omissions or inconsistent disclosure as added uncertainty.
      - Filing names and requirements vary by jurisdiction; U.S. Forms 10-K and 10-Q are annual
        and quarterly examples. Headline EPS alone may omit adjustments that affect comparability.
    depends_on: [income-statement, balance-sheet, cash-flow-statement]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 3; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 6; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 19; Jason Zweig, commentary on chapters 11-12, 17, and 19."

  - id: durable-competitive-advantage
    type: concept
    description: A company-specific strength that helps it sustain better business economics than competitors, such as the ability to charge more or sell more, over time.
    applies_when: Use when assessing business quality and the durability of future earnings. Evidence of franchise-like economics can include a product customers need or strongly prefer, few close substitutes, and the ability to raise prices without materially losing volume; consider regulation and changing competition that may constrain or erode that power. Look for evidence that the advantage persists rather than treating current margins or brand recognition alone as proof.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 1-2; Warren E. Buffett, Berkshire Hathaway shareholder letter for 1991, discussion of franchises."

  - id: industry-growth-vs-investor-returns
    type: concept
    description: An industry can transform society or grow rapidly without delivering attractive returns to its investors; competition, capital requirements, industry structure, and purchase price affect how much value owners capture.
    applies_when: When evaluating a new or fast-growing industry, examine company-level economics, competitive durability, reinvestment needs, and valuation. Do not infer attractive shareholder returns from technological novelty, adoption, or social usefulness alone.
    depends_on: [durable-competitive-advantage, intrinsic-value-margin-of-safety]
    source: "Alice Schroeder, The Snowball: Warren Buffett and the Business of Life (2008), Part One, chapter 2."

  - id: brand-based-product-advantage
    type: concept
    description: A product brand can gain a durable place in customers' minds, supporting preference and repeat demand that may allow the company to maintain pricing power.
    applies_when: Use when assessing whether customers choose a product because of established brand preference; test for repeat demand and pricing resilience rather than treating name recognition or advertising alone as proof of an advantage.
    depends_on: [durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 3."

  - id: institutional-vs-people-specific-service
    type: concept
    description: A service business is more institution-specific when customer relationships and delivery depend on the organization; it is people-specific when clients and economics depend on individual employees.
    applies_when: Assess whether reputation, processes, and customer relationships remain with the firm when key employees leave; client and talent departures together can expose key-person dependence and reduce the share of economics retained by owners.
    depends_on: [durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 3."

  - id: low-cost-buyer-seller-model
    type: concept
    description: A business can compete through a sustained cost advantage in both acquiring and selling a product or service customers regularly need, supporting attractive economics at competitive prices.
    applies_when: Assess purchasing, operating, and selling costs alongside price, margins, and volume; lower margins may work when cost efficiency enables enough volume, but low prices or high sales alone do not establish a durable cost advantage.
    depends_on: [durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 3."

  - id: operating-leverage-sensitivity
    type: heuristic
    description: High unit costs or fixed operating burdens can make the common-stock earnings more sensitive to changes in output, sales, or selling prices.
    applies_when: |-
      - Assess fixed and variable costs, break-even output or prices, and prior claims such as
        interest, preferred dividends, and fixed lease payments.
      - Stress plausible changes in volume, input costs, and selling prices. A small change in
        revenue or commodity price can cause a much larger change in residual earnings when the
        operating margin is thin.
      - High-cost producers may offer greater speculative upside when a price increase is
        well-supported, but their sensitivity also increases downside risk; it is not evidence
        of stronger business quality or a durable advantage.
    depends_on: [gross-margin, interest-to-operating-income, lease-obligations-as-fixed-charges]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapters 40-41."

  - id: business-quality-before-valuation
    type: heuristic
    description: Assess business quality separately from valuation; a durable business may merit a reasonable price without being a deep bargain, but quality never justifies any price.
    applies_when: |-
      - Estimate sustainable earning power, compare it with price, and weigh expected returns
        against risk and alternatives. A good business is not attractive at every price.
      - A low price does not offset persistently weak economics, and a market decline alone does
        not prove a bargain; determine whether the problem threatens the advantage.
      - The nominal share price says little about valuation. Consider total common-equity value,
        share count, senior claims, assets, sales, and normalized earning power; a low quote can
        conceal an excessive valuation for the whole equity issue.
      - Verify claims about management against the operating record; do not pay twice for results
        already reflected in earning power.
      - Reassess when the advantage weakens, price materially exceeds conservative value, or a
        superior after-tax alternative is available.
    depends_on: [durable-competitive-advantage, earnings-yield-on-original-cost, intrinsic-value-margin-of-safety]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 2 and Part V, chapters 39 and 41; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 1-2 and 53-57; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1979 and 1989, discussions of business quality and bargain purchases."

  - id: circle-of-competence
    type: heuristic
    description: Limit investment conclusions to businesses and valuation drivers that can be understood and explained; expertise in one area does not establish expertise in others.
    applies_when: Before investing, check whether you can explain how the business earns money, what drives its economics, and what could impair them. If important factors remain outside your understanding, defer the conclusion or build knowledge before relying on it. Competence can expand through study, but confidence alone does not establish it.
    source: "Alice Schroeder, The Snowball: Warren Buffett and the Business of Life (2008), Part One, chapter 3; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1999 and 2000, discussion of competence and uncertain business economics."

  - id: investment-vs-speculation
    type: concept
    description: >-
      An investment operation is based on thorough analysis, provides reasonable protection of
      principal under normal or reasonably likely conditions, and offers an adequate return.
      Classification depends on terms, price, evidence, and risk, not solely on a security's label
      or holding period.
    applies_when: |-
      - Assess the security and its terms, price, timing and market conditions, and the investor’s
        financial position, knowledge, and needs.
      - Use quantitative evidence and qualitative judgment to estimate value and downside; require
        a margin of safety and adequate return without depending on extraordinary appreciation.
      - Set minimum safety standards first and exclude fixed-income claims that fail them regardless
        of coupon or appealing prospects; among eligible issues, weigh additional safety against
        return.
      - A high coupon alone does not offset weak repayment prospects. If accepting greater principal
        risk, require a separate, credible opportunity for price appreciation, such as a substantial
        discount or favorable conversion feature, and assess correlated losses.
      - Diversification or hedging may reduce issue-specific risk, but cannot repair unsound
        economics. Keep speculative exposure explicit and within a loss the investor can bear;
        borrowing adds risk.
    depends_on: [intrinsic-business-value, circle-of-competence]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapters 1, 4, and Part II, chapters 6-7; Howard S. Marks, Introduction to Part II; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 1 and 20 and commentary on chapter 1; Warren E. Buffett, Berkshire Hathaway shareholder letter for 2000, discussion of valuation, uncertainty, and speculation."

  - id: security-economic-risk-classification
    type: heuristic
    description: Classify a security by its actual rights, financial backing, price, and likely risk-and-return behavior rather than by its legal name alone.
    applies_when: |-
      - Identify payment, maturity, priority, conversion, voting, and other material terms; assess
        the issuer’s ability to honor them and the value supporting the claim.
      - Classify the likely payoff as fixed-value, senior variable-value, or common-stock-like. A
        senior security may behave like equity when its price depends on conversion or its
        priority offers little practical protection.
      - Classification can change with price and company condition. Treat legal labels as a
        starting point, not a safety test.
      - For low-priced senior claims of doubtful safety, analyze the issuer and its prospects
        with the same rigor used for common-stock speculation; contractual priority alone is not
        evidence of adequate protection.
    depends_on: [preferred-stock-priority, convertible-security-analysis, investment-vs-speculation]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapters 2 and 5 and Part III, chapters 22 and 26."

  - id: analysis-effort-proportionality
    type: heuristic
    description: Match the depth and cost of research to the size, complexity, and purpose of the investment decision.
    applies_when: >-
      Identify which facts could change the decision and prioritize information
      that is material, reliable, and practical to obtain. A larger or more
      complex commitment, or one relying on a thinner margin of safety, warrants
      more work. Do not mistake a large volume of available data for relevant
      evidence; stop when additional analysis is unlikely to improve the
      decision enough to justify its cost, or when essential evidence cannot be
      obtained.
    depends_on: [investment-vs-speculation, primary-filings-for-financial-analysis]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapters 2 and 3."

  - id: investor-risk-calibration
    type: heuristic
    description: >-
      Assess the investor's confidence in an analysis and ability to bear the
      consequences of error, separately from the investment's estimated business
      value.
    applies_when: >-
      Compare confidence with experience and results on similar decisions,
      consider what the other side of the trade may know, and estimate plausible
      losses, taxes, trading costs, and the return needed to break even. Consider
      liquidity needs and likely behavior during a severe decline; size positions
      and set diversification or rebalancing rules so a mistaken judgment cannot
      cause catastrophic loss. Risk tolerance stated in advance is weaker
      evidence than observed behavior under loss.
    depends_on: [circle-of-competence, defensive-vs-enterprising-investor-policy, portfolio-diversification]
    source: "Jason Zweig, commentary on chapter 20 in Benjamin Graham, The Intelligent Investor (2003 edition), discussion of calibrated confidence, anticipated regret, probabilities, and consequences."

  - id: defensive-vs-enterprising-investor-policy
    type: heuristic
    description: >-
      Graham's categories describe the effort, knowledge, and discipline an investor brings to
      security selection. Defensive investing favors simplicity and limited ongoing work;
      enterprising investing requires sustained analysis and a defensible source of advantage.
    applies_when: |-
      - Choose an approach that fits available time, analytical ability, temperament, cash needs,
        time horizon, and capacity to withstand loss; age alone does not determine allocation.
      - Maintain accessible reserves and choose stock and bond targets that can be held through a
        severe decline. Set allocation and rebalancing rules in advance rather than reacting to
        market forecasts.
      - Use an active approach only when a sound method and plausible source of advantage can be
        explained; more research or risk does not ensure better returns.
      - Before committing substantial capital to individual selection, compare documented
        decisions, including losses, with a suitable index after costs.
      - For defensive stock selection, emphasize diversification, financial strength, a long
        operating and dividend record, and a price justified by normalized earnings. Graham’s
        numerical screens are historical guidance, not universal cutoffs.
    depends_on: [investment-vs-speculation, portfolio-diversification]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 1, 4, 5, 14, and 15; Jason Zweig, commentary on chapters 4, 5, 14, and 15."

  - id: new-issue-valuation-risk
    type: heuristic
    description: >-
      New securities, especially newly public common stocks, can carry added
      valuation and information risk because issuers and underwriters have an
      incentive to sell when market conditions favor them, often with unusually
      strong promotion and a limited public-company record.
    applies_when: |-
      - Do not infer investment merit from demand, a first-day price jump, or a persuasive sales
        case.
      - Review operating history, financial position, security terms, use of proceeds, insider
        sales, and valuation against sustainable earning power.
      - Compare unit economics, losses, cash needs, and potential dilution with established
        competitors. A short record warrants stricter evidence, but a new issue is not
        automatically unsound.
    depends_on: [investment-vs-speculation, price-earnings-ratio, intrinsic-value-margin-of-safety]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 6 and 17; Jason Zweig, commentary on chapters 6 and 17."

  - id: special-situation-analysis
    type: heuristic
    description: Event-driven investments seek a defined return from a merger, liquidation, reorganization, or similar corporate action rather than relying only on ongoing business growth.
    applies_when: |-
      - Estimate the return if the event closes and the loss or recovery value if it fails; assess
        probability and timing.
      - Review financing, regulatory and shareholder approvals, transaction terms, taxes, and
        trading costs.
      - Diversify across independent situations when appropriate. A stated deal spread or asset
        value is not guaranteed, and the work may require specialist experience.
    depends_on: [intrinsic-business-value, net-current-asset-value, portfolio-diversification]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 15 and commentary on chapter 15."

  - id: distressed-security-recovery-analysis
    type: heuristic
    description: A distressed security's value depends on realizable assets, the business's going-concern value, claim priority, and the outcome and timing of the legal process.
    applies_when: |-
      - Map the legal issuer, claim class, collateral, guarantees, subsidiary and parent claims,
        and competing creditors; estimate recoveries from enforceable rights, not face value.
      - Compare liquidation proceeds with going-concern value and model what each class may
        receive as cash, new debt, preferred shares, or equity. Assess timing, process costs,
        illiquidity, and the risk that proposed recoveries change.
      - Reconcile legal remedies with what the business can financially support. A bankruptcy
        filing does not by itself establish insolvency or mean that equity will be eliminated.
    depends_on: [special-situation-analysis, subsidiary-credit-analysis, contractual-guarantee-credit-analysis, credit-covenant-quality-and-remedies, net-current-asset-value]
    source: "J. Ezra Merkin, Introduction to Part III, in Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008); Benjamin Graham and David Dodd, Part III, chapter 26."

  - id: maximum-valuation-for-senior-issues
    type: concept
    description: A senior security cannot be intrinsically worth more than the value of the whole business if it alone represented ownership and all junior claims were removed.
    applies_when: |-
      - Use this as a ceiling when testing the valuation of a bond or preferred issue; compare its
        market value with the total value supportable by the issuer's business.
      - Accrued preferred dividends, coupon rates, par values, and redemption claims determine
        priority or allocation but do not create additional value for the enterprise.
      - This is a negative overvaluation test, not a complete way to value the issue; value the
        business and account for claims shared with or senior to the security.
    depends_on: [intrinsic-business-value, preferred-stock-priority, balance-sheet]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part III, chapter 26."

  - id: historical-strategy-decay
    type: heuristic
    description: >-
      A strategy that looks successful in historical data may fail because its
      pattern was selected from random noise, or because competition after
      discovery and publication removes a real source of excess return.
    applies_when: >-
      Before relying on a screen or trading rule, identify a plausible economic
      reason it should work, test it on data not used to create it, and account
      for trading costs, taxes, liquidity, and capacity. Reassess strategies
      after they become widely known; historical outperformance alone does not
      establish a durable edge.
    depends_on: [investment-vs-speculation]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 1 and commentary on chapter 1."

  - id: real-return-after-inflation
    type: formula
    description: The investment return adjusted for the change in purchasing power over the same period.
    formula: (((1 + nominal_return_rate) / (1 + inflation_rate)) - 1) * 100
    applies_when: Express nominal_return_rate and inflation_rate as decimal rates for the same period. This measures return after inflation but before taxes, fees, and other costs; a positive nominal return can still be a negative real return.
    source: "Jason Zweig, commentary on chapter 2 in Benjamin Graham, The Intelligent Investor (2003 edition), discussion of money illusion and real returns."

  - id: inflation-and-equity-earnings
    type: concept
    description: >-
      Inflation does not automatically raise real corporate earnings or stock
      returns. A company may raise prices, but higher wages, input costs,
      financing costs, capital requirements, or weaker customer demand can offset
      those increases; the effects depend on the business and the inflation
      environment.
    applies_when: >-
      Measure investment results after inflation and examine company-specific
      pricing power, sales volume, input and labor costs, working capital,
      replacement investment, and financing costs across plausible inflation
      scenarios. Do not infer that stocks will reliably hedge inflation over
      short or intermediate periods, or that rising nominal revenue means rising
      real earning power.
    depends_on: [real-return-after-inflation, durable-competitive-advantage, intrinsic-business-value]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 2; Jason Zweig, commentary on chapter 2."

  - id: bond-price-and-purchasing-power-risk
    type: concept
    description: >-
      A high-grade bond can still lose market value when rates rise and purchasing power when
      inflation rises. Call terms may limit gains when rates fall while leaving the investor
      exposed to losses.
    applies_when: |-
      - Separate issuer repayment risk from market-price risk and real-return risk. Consider
        maturity, rate sensitivity, call price and protection period, yield, inflation, and
        holding period.
      - Longer maturities generally have greater price sensitivity to yield changes.
      - Check whether a high yield compensates for weaker credit or other risks; high credit
        quality does not prevent market or purchasing-power loss.
    depends_on: [real-return-after-inflation]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 1-2 and 4."

  - id: market-return-components
    type: concept
    description: >-
      Long-run stock returns roughly reflect per-share business growth, inflation, dividends, and
      changes in valuation. Valuation expansion or contraction can cause market returns to diverge
      from business growth for extended periods.
    applies_when: >-
      Build return expectations from sustainable per-share earnings growth,
      dividend yield, inflation, and a plausible range of valuation changes.
      Separate business performance from multiple expansion or contraction, and
      do not project unusually strong historical market returns forward without
      checking how much came from rising valuations.
    depends_on: [earnings-per-share, real-return-after-inflation, market-price-vs-business-economics]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 3 and commentary on chapter 3."

  - id: stock-bond-relative-valuation
    type: heuristic
    description: >-
      Comparing normalized stock earnings yields (the inverse of P/E ratios) and
      dividend yields with high-grade bond yields helps assess the relative
      attractiveness of stocks and bonds at current prices; it does not establish
      that either asset class is attractive in absolute terms.
    applies_when: >-
      Use multi-year or otherwise normalized earnings for the stock earnings
      yield and compare with yields on bonds of suitable quality and maturity.
      Account for the greater uncertainty and growth potential of equity
      earnings, bond credit and interest-rate risk, inflation, and investor-level
      taxes. Treat the comparison as context for valuation and allocation, not a
      fixed market-timing threshold.
    depends_on: [price-earnings-ratio, dividend-yield, bond-price-and-purchasing-power-risk, pre-tax-investment-comparison]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 3-4 and 14."

  - id: survivorship-bias-in-market-history
    type: heuristic
    description: >-
      Historical market records can overstate returns when indexes or studies
      include surviving companies but omit firms that failed, were delisted, or
      disappeared from the data.
    applies_when: >-
      Before relying on long-run market or strategy returns, check how the sample
      was constructed, whether failed and delisted firms are included, and how
      representative the index is of the investable market at the time. Treat
      incomplete early records and survivor-only samples as uncertain evidence,
      not proof that an asset class or strategy is guaranteed to outperform.
    source: "Jason Zweig, commentary on chapter 3 in Benjamin Graham, The Intelligent Investor (2003 edition), discussion of survivorship bias in historical stock indexes."

  - id: market-price-vs-business-economics
    type: concept
    description: Market prices can diverge from a company's long-term earning and cash-generating economics in either direction; recognition of underlying value may take time, and prices can also overshoot value. A market quotation is an offer to transact, not a command or a substitute for independent valuation.
    applies_when: |-
      - When a share price moves sharply, reassess operating results, earning power, and
        valuation; a price move alone neither proves deterioration nor establishes a bargain.
      - Compare price paid and received with intrinsic value. Investor returns can differ from
        business growth when that relationship changes.
      - Review lasting business deterioration, but do not mistake temporary quotations for
        permanent loss unless a sale is forced, business value falls, or the purchase price was
        excessive.
    depends_on: [intrinsic-business-value, investment-vs-speculation]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 3 and 8; Jason Zweig, commentary on chapter 8; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 2, 53, 55, and 57; Warren E. Buffett, Berkshire Hathaway shareholder letter for 1990, discussion of company and shareholder returns."

  - id: durable-advantage-compounding
    type: concept
    description: >-
      A durable advantage can support compounding when retained earnings are reinvested at
      attractive rates. Minority owners may benefit from investee earnings retained for their
      benefit even when those earnings are not paid as dividends.
    applies_when: |-
      - Assess whether retained earnings earn attractive incremental returns and improve
        sustainable per-share value; compare retention with distributions and other uses of
        capital.
      - Strong returns in the existing business do not establish that acquisitions will earn
        attractive returns. Review each major reinvestment separately.
      - When reinvestment opportunities are poor or capital needs are low, distributions or
        repurchases of attractively priced shares may be preferable; financial weakness may
        constrain them.
      - For minority holdings, compare the investor’s share of retained earnings with dividends
        and assess management’s returns on retained capital.
      - Retained earnings are not a cash reserve and do not guarantee profitable growth. Include
        maintenance, product renewal, and retooling needs; a larger capital base can also make the
        same growth rate harder to sustain.
    depends_on: [durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 2, 4, 45, and 53-54; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 19 and commentary on chapter 19; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part IV, chapters 28-29; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1978 (March 26, 1979), 1980, 1984, 1988, 2010-2012, 2019-2020, and 2022-2024, discussion of retained earnings, look-through earnings, and long-term compounding."

  - id: look-through-earnings
    type: formula
    description: An estimate of reported operating earnings plus an investor's share of investee earnings retained for its benefit, less the additional taxes that would apply if those earnings were distributed.
    formula: reported_operating_earnings + share_of_investee_earnings_not_recognized_in_reported_earnings - hypothetical_incremental_taxes_on_distribution
    applies_when: Use for minority investments whose share of earnings is not included in the investor's reported income beyond dividends. Include only investee earnings that are retained and attributable to the investor, avoid counting earnings already recognized, and estimate the investor-level tax that a distribution would trigger. This is an economic analysis measure, not GAAP earnings or cash received.
    depends_on: [income-statement, durable-advantage-compounding]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 1980, 1990-1993, 1996-1997, 1999-2000, 2011-2012, 2019-2021, and 2023, discussion of investee earnings and look-through earnings."

  - id: subsidiary-earnings-reconciliation
    type: heuristic
    description: Reconcile a parent company's reported earnings with the current results of controlled subsidiaries and material affiliates.
    applies_when: |-
      - Use consolidated results for material controlled subsidiaries when parent-only figures omit
        their profits or losses. For material unconsolidated affiliates, reflect the parent's share
        of current results when it is not already included.
      - Compare dividends received with the affiliate's current earnings. Identify special or back
        dividends drawn from earnings accumulated in earlier periods, and eliminate intercompany
        transfers that create reported income without new group earnings.
      - Include subsidiary losses in the initial analysis. Treat them as removable from future
        earning power only when evidence shows they can be ended without impairing the parent's
        other operations; investigate operational links, exit costs, and asset write-downs.
      - Materiality depends on the effect on the parent company's earning power, not only on legal
        control. Use look-through-earnings for the separate case of unrecognized earnings from
        minority investments.
    depends_on: [income-statement, balance-sheet, look-through-earnings]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapters 31 and 33."

  - id: financial-consistency-as-durability-evidence
    type: heuristic
    description: A multi-year pattern of stable or strong margins, manageable debt, consistent earnings, and returns not driven mainly by leverage or shrinking equity can be evidence that a competitive advantage is durable; assess R&D spending in light of the business's need to renew products or defend its position.
    applies_when: |-
      - Review margins, earnings, financial strength, and returns over several years and in the
        context of the industry and business model.
      - Ask whether stable results fit the business’s underlying economics; a brief record may
        mislead in cyclical or rapidly changing industries. Treat trends as hypotheses, not facts
        about the future.
      - Check whether leverage, share-count changes, or repurchases explain reported returns.
        Assess reinvestment needs, including capital expenditure and R&D, using the related
        measures rather than one fixed cutoff.
      - Separate operating quality from valuation and treat financial consistency as evidence to
        investigate, not proof of a durable advantage.
    depends_on: [durable-competitive-advantage, gross-margin, net-profit-margin, earnings-per-share, return-on-equity, total-liabilities-to-equity, capital-expenditure-to-net-earnings, income-statement, balance-sheet, rd-to-gross-profit]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 2; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 4, 7, 10, 12-13, 19-20, 42, and 46-52; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 13 and 18 and commentary on chapter 18."

  - id: inventory-growth-vs-sales
    type: heuristic
    description: Compare inventory trends with sales and earnings to assess whether stock levels are supporting demand or accumulating faster than the business can sell.
    applies_when: Review multiple periods and the company's business model. Inventory rising alongside profitable sales growth may reflect stock needed to fulfill demand; inventory growing faster than sales or reversing sharply may signal slower demand, overproduction, obsolescence, or a cyclical business. Account for seasonality, acquisitions, input prices, and inventory write-downs.
    depends_on: [balance-sheet, income-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 25; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapter 45."

  - id: goodwill-and-acquisition-quality
    type: heuristic
    description: Goodwill is an acquisition-related balance-sheet amount that can arise when purchase consideration exceeds the recognized value of identifiable net assets; its presence or growth alone does not show that an acquisition created value.
    applies_when: |-
      - Separate organic growth from acquisitions; assess purchase price, financing, and
        subsequent cash generation and returns.
      - Track goodwill and tangible equity, but do not treat goodwill alone as proof of an
        advantage or successful acquisition.
      - For serial acquirers, recurring integration, restructuring, impairment, or
        acquired-research charges may be normal costs rather than one-time items; accounting
        choices can also affect reported assets and earnings.
    depends_on: [balance-sheet, income-statement, cash-flow-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 30; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 17 and commentary on chapter 17."

  - id: long-term-investments-as-capital-allocation
    type: heuristic
    description: A company's long-term investments can reveal how management allocates capital beyond its core operations and whether it chooses holdings with sound long-term economics.
    applies_when: |-
      - Review holdings, concentration, capital committed, disclosures, and subsequent economics;
        compare after-tax returns and per-share value rather than accounting income alone.
      - Account for scale: do not lower return or quality standards simply to deploy a large
        capital base.
      - For controlled and minority investments, weigh the benefits of control against its price
        and responsibilities.
      - For share-financed acquisitions, compare the value received with ownership surrendered.
        Compare carrying values with underlying economics because accounting bases vary.
    depends_on: [balance-sheet, cash-flow-statement, durable-competitive-advantage]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 32; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1988-1989, 1992, 1997-2000, 2005, 2008-2012, 2014, 2018-2021, and 2023-2024, discussion of investment alternatives, acquisitions, ownership scale, and per-share value."

  - id: share-repurchase-value
    type: heuristic
    description: A share repurchase creates value for continuing owners when the company has funds beyond business needs and buys shares below a conservative estimate of intrinsic value per share.
    applies_when: |-
      - Fund required maintenance and attractive growth investments first; then compare the
        repurchase price with a conservative intrinsic-value range and consider other uses of
        excess capital.
      - Repurchases above intrinsic value transfer value from continuing owners to sellers. When
        substantial excess cash is not needed, compare open-market repurchases with a fair offer
        to all shareholders or a pro-rata distribution; consider whether insiders receive a
        selective benefit.
      - A lower share count, EPS increase, or stock-price support does not by itself establish
        value creation. Provide shareholders enough information to assess the decision.
    depends_on: [intrinsic-business-value, owner-earnings]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), commentary on chapter 19; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part VI, chapter 44; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1999-2000, 2011-2012, and 2018-2020, 2022-2023, discussion of repurchase price, available funds, and per-share value."

  - id: stock-based-compensation-cost
    type: concept
    description: Employee stock options and other share-based awards compensate employees by transferring economic value and ownership from existing shareholders; their economic cost should be considered alongside any expense recognized in reported earnings.
    applies_when: Review award quantity, terms, dilution, vesting, and the economic value transferred when estimating owner earnings or per-share value. Treat share repurchases as a separate capital-allocation decision; buying shares above intrinsic value to offset option dilution can destroy value rather than make the compensation cost disappear.
    depends_on: [earnings-per-share, intrinsic-business-value]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), commentary on chapter 19; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1997, 1998, and 2017, discussion of stock-option accounting and the limits of adjusted earnings that exclude compensation costs."

  - id: institutional-imperative
    type: heuristic
    description: Organizational habits can push managers to preserve the current direction, spend available funds, rationalize a leader's preferences, and imitate peers even when those choices do not maximize owner value.
    applies_when: |-
      - Review acquisitions, expansion, spending, and compensation for peer imitation, deference
        to authority, default use of available cash, or lack of an economic hurdle.
      - Preserve the original rationale and assumptions, seek disconfirming evidence, and compare
        outcomes with expectations; stop weak projects and correct poor allocations promptly.
      - These pressures can affect decisions without deliberate dishonesty or incompetence.
    depends_on: [long-term-investments-as-capital-allocation]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 1989, section 'Mistakes of the First Twenty-five Years,' 2004, discussion of the institutional imperative in insurance underwriting, and 2024, discussion of correcting capital-allocation and hiring mistakes; Charlie Munger, 'The Psychology of Human Misjudgment' (1995), discussion of social proof, authority, postmortems, and disconfirming evidence."

  - id: management-owner-alignment
    type: concept
    description: Management is owner-aligned when leaders have incentives and operating freedom to build long-term per-share value, communicate candidly, and make decisions as stewards of the owners' capital.
    applies_when: |-
      - Assess ownership and incentives, including whether they reward durable operating results
        rather than one-period growth or share-price targets.
      - Compare results with peers and management’s stated plans; persistent underperformance
        warrants scrutiny of leadership and board oversight.
      - Review compensation, conflicts, succession, retention, and reporting candor. Check whether
        advisers’ incentives reward sound outcomes or transaction volume. Repeatedly shifting
        losses out of income while recognizing gains in it, or refusing to explain material
        reconciliations, is a serious reliability concern that cannot be repaired by a precise
        earnings haircut.
      - Decentralization works when managers are capable and trustworthy and results are visible;
        avoid needless head-office interference.
    depends_on: [long-term-investments-as-capital-allocation, institutional-imperative]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapter 33 and Part VI, chapter 44; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 19 and commentary on chapters 15 and 19; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1991, 1996, 1998, 2000, 2001-2002, 2006, 2009-2011, 2014, and 2024, discussion of managers, incentives, autonomy, candid reporting, culture, succession, and correcting mistakes; Charlie Munger, 'The Psychology of Human Misjudgment' (1995), discussion of incentive-caused bias."

  - id: lollapalooza-bias-combination
    type: heuristic
    description: Several psychological tendencies can reinforce one another and produce a much stronger distortion of judgment than any one tendency acting alone.
    applies_when: Before major investments, acquisitions, auctions, or governance decisions, look for combinations of incentives, social proof, authority, scarcity or loss aversion, commitment to prior choices, and vivid recent outcomes. When several pressures point in the same direction, pause for independent challenge and apply a precommitted valuation or decision rule. A bias cluster signals elevated error risk; it does not by itself prove the decision is wrong.
    depends_on: [institutional-imperative, management-owner-alignment, intrinsic-business-value]
    source: "Charlie Munger, 'The Psychology of Human Misjudgment,' speech delivered at Harvard University (1995), transcript hosted by James Clear, discussion of interacting psychological tendencies and lollapalooza effects."

  - id: debt-maturity-and-refinancing-risk
    type: heuristic
    description: Prudent borrowing can benefit a strong business, while debt beyond sustainable repayment capacity, reliance on short-term funding for longer-term assets, or concentrated repayments can create payment, refinancing, interest-rate, and liquidity risk.
    applies_when: |-
      - Review maturity and rate schedules, liquidity, cash generation, collateral, and committed
        funding; compare debt with sustainable earnings and cash flow.
      - For financial institutions, compare funding maturities and repricing with asset maturities
        and repricing.
      - Leverage magnifies shocks and managerial errors; stress-test the ability to meet
        obligations without assuming refinancing or asset sales will remain available.
      - Do not treat debt as inherently harmful or debt retirement as always beneficial. Assess
        whether borrowing is proportionate to durable earning power and remains serviceable in
        adversity; debt issued because equity financing is unavailable may signal weak credit
        quality.
      - Distinguish current maturities of long-term debt from short-term borrowing. Debt levels
        vary by business model, and a strong past operating record does not eliminate risks from
        added leverage.
    depends_on: [balance-sheet, cash-flow-statement]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 37-40; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapter 7 and Part VI, chapter 45; Warren E. Buffett, Berkshire Hathaway shareholder letter for 1989, discussion of leverage and permanent financial risk."

  - id: lease-obligations-as-fixed-charges
    type: heuristic
    description: Long-term lease payments can impose a fixed financing burden even when they do not appear as ordinary funded debt.
    applies_when: |-
      - Review lease commitments, payment schedules, renewal and termination terms, and the
        business's reliance on leased locations or equipment.
      - Include material fixed lease payments when comparing cash generation with fixed claims;
        distinguish fixed commitments from variable or short-term occupancy costs.
      - Compare leased operations with owned-property alternatives and stress-test occupancy,
        renewal costs, and the ability to exit or sublet. Avoid universal adjustment factors.
    depends_on: [interest-to-operating-income, debt-maturity-and-refinancing-risk]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapters 10 and 17."

  - id: contractual-guarantee-credit-analysis
    type: heuristic
    description: A contractual guarantee can add a claim against another obligor, but its value depends on its enforceable terms and the guarantor's capacity to pay.
    applies_when: |-
      - Read the guarantee for scope, duration, triggers, caps, governing jurisdiction, and whether
        it covers principal, interest, dividends, or only specified payments.
      - Assess the guarantor's own earning power, debt, liquidity, and other guarantees under
        stress; multiple guarantors provide less protection when their risks are highly correlated.
      - Do not treat ownership, reputation, government supervision, or expected support as a
        contractual guarantee. Analyze the issuer's own ability to pay as well.
    depends_on: [interest-to-operating-income, debt-maturity-and-refinancing-risk]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapters 16-17."

  - id: subsidiary-credit-analysis
    type: heuristic
    description: A subsidiary bond is supported by the subsidiary's own assets and cash flows unless a parent has directly assumed or guaranteed the obligation.
    applies_when: |-
      - Identify the legal issuer and analyze its stand-alone earnings, liquidity, debt, and
        assets; consolidated coverage does not by itself give subsidiary creditors recourse to
        parent cash or property.
      - Verify any guarantee, lease, or direct assumption before relying on parent support. Treat
        strategic importance or a parent's past assistance as uncertain unless contractually
        required.
      - Check where cash is held, restrictions on upstreaming it, and claims senior to the issue
        at both the subsidiary and parent levels.
    depends_on: [debt-maturity-and-refinancing-risk, contractual-guarantee-credit-analysis]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapter 17."

  - id: credit-covenant-quality-and-remedies
    type: heuristic
    description: Debt covenants restrict actions that could weaken creditor protection, while their practical value depends on monitoring, enforceability, and workable remedies.
    applies_when: |-
      - Review limits on senior liens and additional debt, asset sales, dividends, working capital,
        and required asset coverage; assess whether the tests fit the issuer's risks.
      - Check reporting duties, default triggers, cure periods, trustee responsibilities, and
        remedies. A covenant that can only trigger destructive acceleration may leave creditors
        choosing between harming the business and taking no action.
      - Distinguish contractual protections from operating strength. Covenants can preserve
        creditor options but do not make a weak business safe.
    depends_on: [security-economic-risk-classification, debt-maturity-and-refinancing-risk]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapters 18-19."

  - id: ongoing-credit-supervision
    type: heuristic
    description: Credit quality can change after purchase, so fixed-income holdings require periodic review of the issuer, its obligations, and the security's terms.
    applies_when: |-
      - Revisit earnings coverage, cash generation, leverage, liquidity, maturities, guarantees,
        and covenant compliance on a regular schedule and after material events.
      - Compare new evidence with the original safety case; set review or exit triggers before a
        crisis, and consider whether a deteriorating issuer still meets minimum standards.
      - Do not confuse issuer monitoring with forecasts of general bond-market moves. When
        switching, weigh the current price and available alternatives rather than holding solely
        to avoid recognizing a loss.
    depends_on: [interest-to-operating-income, debt-maturity-and-refinancing-risk, security-economic-risk-classification]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapter 21; Howard S. Marks, Introduction to Part II."

  - id: regulated-utility-regulatory-risk
    type: heuristic
    description: A regulated utility's long-lived assets and apparently stable earnings depend on regulators allowing timely cost recovery and an adequate return; catastrophic liabilities or changes to that regulatory compact can impair both cash flows and asset value.
    applies_when: |-
      - Analyze jurisdictions separately, including allowed returns, rate-case timing, and
        responsibility for wildfire or other catastrophe losses and insurance limits.
      - Review required replacement and adaptation capital, project payback, and the risk that
        regulators deny cost recovery or change rules.
      - Do not assume essential service or stable history guarantees returns. Reassess investment
        when future economics are unclear or expected returns become inadequate.
    depends_on: [intrinsic-business-value, owner-earnings, long-term-investments-as-capital-allocation]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 2023-2024, discussion of Berkshire Hathaway Energy's wildfire exposures, regulatory uncertainty, and long-duration utility investment."

  - id: derivative-counterparty-and-contagion-risk
    type: concept
    description: Derivatives can create valuation, leverage, collateral, liquidity, and counterparty exposures that are difficult to assess and may spread across connected institutions.
    applies_when: |-
      - Review contract terms, maturity, reference items, valuation methods, collateral triggers,
        and gross and net exposures by counterparty.
      - Model-based gains may precede settlement and rely on assumptions that cannot be verified
        in an active market.
      - Stress-test downgrade and market shocks for collateral calls and correlated counterparty
        weakness. Netting, hedging, and diversification leave residual exposure; treat opacity as
        material risk.
    depends_on: [balance-sheet, cash-flow-statement, debt-maturity-and-refinancing-risk]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 2002 and 2008, discussions of mark-to-model valuation, collateral calls, counterparty risk, and systemic contagion."

  - id: liquidity-as-financial-optionality
    type: concept
    description: Liquid reserves help a business meet obligations without forced sales and preserve the ability to invest when markets or counterparties are under stress; this flexibility has value even when cash earns little.
    applies_when: Size reserves against plausible operating, insurance, debt, and collateral needs, while considering the cost of low-return cash and the opportunities liquidity may preserve. Do not assume external funding or asset sales will remain available in a crisis. A large reserve is not automatically efficient, so assess it in relation to the business's risks, obligations, cash generation, and investment opportunities rather than applying a universal cash target.
    depends_on: [balance-sheet, cash-flow-statement, debt-maturity-and-refinancing-risk]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 2008-2010, 2020-2021, and 2023, discussions of financial strength, cash reserves, and readiness for market stress."

  - id: borrower-repayment-capacity
    type: heuristic
    description: Sound credit underwriting bases loan size and terms on a borrower's ability to make payments from sustainable income, supported by meaningful borrower equity; expected collateral appreciation is not a substitute for repayment capacity.
    applies_when: Assess verified income, fixed payment burden, down payment, loan structure, and the borrower's resilience to ordinary shocks. Consider whether the lender retains the credit risk or transfers it, since retaining a loan can strengthen incentives to underwrite responsibly. Collateral remains relevant to recovery, but rising asset prices or refinancing should not be the primary repayment plan.
    depends_on: [balance-sheet, debt-maturity-and-refinancing-risk]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 2007 and 2010, discussions of housing-credit standards and Clayton Homes' lending practices."

  - id: insurance-underwriting-cycle-discipline
    type: heuristic
    description: Insurance underwriting profitability moves in cycles because claim costs and premium rates adjust at different speeds; sound underwriting requires pricing risk adequately rather than pursuing premium volume at any price.
    applies_when: |-
      - Track loss-cost inflation, claims, renewal timing, rate adequacy, and industry capacity.
        Reduce or exit underpriced business rather than preserving volume at an expected loss.
      - For volatile or long-tail risks, allow contracts to be repriced as loss information
        changes; early reserves may understate eventual costs.
      - Include catastrophe losses in through-cycle economics; a catastrophe-light period can make
        current margins unrepresentative.
      - Separate underwriting from investment income. A combined ratio above 100 indicates an
        underwriting loss before investment results; competitor capacity can recover quickly after
        losses or reserve problems.
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 1977 (March 14, 1978), 1979, 1983-1985, 1988-1990, 2001-2002, 2005-2007, and 2023-2024, discussions of underwriting cycles, reserves, catastrophe risk, policy terms, and insurance capacity."

  - id: insurance-float-cost
    type: formula
    description: The underwriting profit or loss relative to the average insurance float held during a period; it estimates the cost or benefit of using policyholder funds before investment earnings on those funds.
    formula: (-underwriting_profit / average_float) * 100
    applies_when: Use underwriting profit before investment income and average float over the same period; a positive result is a cost, while a negative result means underwriting generated funds at a profit. Interpret cautiously for long-tail lines because reserve estimates can change as claims develop, and the true cost may remain unknown until claims are settled.
    depends_on: [insurance-underwriting-cycle-discipline]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 1990, 1996-2002, and 2004-2008, discussion of float and its cost."

  - id: insurance-float-economics
    type: concept
    description: Insurance float is money held between premium collection and claim payment; it is recorded as a liability because the insurer owes claims, while its economic value depends on the amount, duration, and cost of the funds.
    applies_when: |-
      - Assess float with underwriting results, reserve reliability, claim timing, and expected
        investment returns. A stable, replenishable pool can provide funds only while claims
        remain payable and underwriting economics are sound.
      - Underwriting profit can make float a source of funds with negative cost; underwriting
        losses make it costly, and underpriced liabilities can destroy value.
      - Low rates can reduce investment income, but do not reach for yield beyond risks the
        insurer can support.
      - Float is not owned capital; judge its economics over time, not from one year.
    depends_on: [insurance-float-cost, insurance-underwriting-cycle-discipline]
    source: "Warren E. Buffett, Berkshire Hathaway shareholder letters for 1991, 1995-1998, 2000-2002, 2004-2008, 2010, 2013, 2019-2022, and 2024, discussion of insurance float, reserves, underwriting cost, and investment returns."

  - id: normalize-earnings-for-nonrecurring-items
    type: heuristic
    description: Separate recurring earning power from unusual or infrequent gains and losses that can distort reported net earnings.
    applies_when: |-
      - Exclude an item only after checking its nature and recurrence. Asset-sale gains or losses
        reflect proceeds versus carrying value; restructuring, write-downs, and acquisition costs
        may recur or be part of normal economics.
      - Use multi-year results and, where relevant, a full operating cycle. Check changes in
        revenue recognition, capitalization, depreciation, inventory, research, pensions, and
        taxes for comparability.
      - Follow unusual charges and credits through the balance sheet and later periods. Do not
        remove ordinary operating losses from a full-cycle record simply because they are large
        or charged directly to surplus; reserves and write-downs can also alter later earnings.
      - For marked-to-market securities, separate operating results from market movements when
        assessing operations, but include those movements in total economic returns.
      - Cross-check adjusted earnings against reported results and cash flow; adjusted measures
        may omit real costs or be managed to meet targets. Relate income to beginning and ending
        balance sheets and investigate material gaps between reported earnings and other evidence.
      - Separate one-time tax remeasurements from operating trends. For insurance catastrophe and
        reserve costs, use the through-cycle guidance in insurance-underwriting-cycle-discipline.
    depends_on: [income-statement, income-before-tax, insurance-underwriting-cycle-discipline]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part V, chapters 31-34 and 37 and Part VI, chapter 45; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 16; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 12 and 17 and commentary on chapter 17; Warren E. Buffett, Berkshire Hathaway shareholder letters for 2002, 2007, 2017-2018, and 2020-2024, discussion of catastrophe losses, normalized insurance results, adjusted earnings, tax-law remeasurement, and unrealized investment gains and losses in GAAP earnings."

  - id: pre-tax-investment-comparison
    type: heuristic
    description: Comparing pre-tax earnings or returns can place taxable business investments and other taxable investments on a more consistent basis.
    applies_when: Use pre-tax comparisons to assess underlying earning power; account separately for tax-exempt investments and investor-specific tax effects when comparing actual after-tax outcomes.
    depends_on: [income-before-tax]
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 17."

  - id: portfolio-diversification
    type: concept
    description: Spreading investments across companies can reduce the impact of one company's failure or prolonged undervaluation, but does not remove market-wide risk.
    applies_when: |-
      - Diversify across investments with defensible favorable odds to reduce the effect of
        individual errors; diversification complements analysis and margin of safety.
      - It cannot make negative-expectation investments sound or remove market-wide and correlated
        risks. Assess common industries, funding sources, and economic exposures; credit losses can
        cluster during downturns. A few winners may drive results, but that does not make
        concentration safe.
      - Size concentrated positions according to understanding, valuation, and ability to
        withstand permanent impairment; do not use a fixed number of holdings.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapter 2; Benjamin Graham, The Intelligent Investor (2003 edition), chapters 14 and 20 and commentaries on chapters 14-15 and 20; Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), Part II, chapter 7 and Part IV, chapter 28; Howard S. Marks, Introduction to Part II; Warren E. Buffett, Berkshire Hathaway shareholder letters for 2022-2023, discussion of compounding winners, concentration, and long-term ownership."

  - id: low-cost-index-fund-benchmark
    type: heuristic
    description: A broad, low-cost index fund can serve as a diversified benchmark and practical option for investors who lack a well-supported reason to expect active management to outperform after fees and costs.
    applies_when: |-
      - Compare active results with an appropriate index after fees, trading costs, sales charges,
        and taxes over a period covering a full market cycle.
      - Account for index scope, concentration, strategy risk, taxes, and mandate. High turnover
        or fund growth can raise costs or constrain a strategy; recent performance does not prove
        future skill.
      - Low fees and diversification improve the comparison but do not guarantee positive returns
        or make every index suitable for every investor.
    depends_on: [portfolio-diversification]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapters 9 and 14-15 and commentaries on chapters 9 and 14; Warren E. Buffett, Berkshire Hathaway shareholder letters for 2016 and 2017, discussion of the ten-year index-fund wager and the effect of fees on investment results."

  - id: closed-end-fund-discount-to-nav
    type: formula
    description: The percentage by which a closed-end fund's market price is below its net asset value per share; a negative result indicates a premium.
    formula: ((net_asset_value_per_share - market_price_per_share) / net_asset_value_per_share) * 100
    applies_when: Use when net asset value per share is positive. A discount can improve the entry price relative to underlying holdings, but it may persist or widen and does not prove the portfolio is attractive. Check fees, leverage, liquidity, distribution policy, portfolio quality, and the fund's discount history; compare with suitable alternatives rather than assuming the discount will close.
    depends_on: [portfolio-diversification, intrinsic-value-margin-of-safety]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 9; Jason Zweig, commentary on chapter 9."

  - id: dollar-cost-averaging
    type: heuristic
    description: Investing a fixed dollar amount at regular intervals buys more units when prices are lower and fewer when prices are higher, reducing dependence on choosing one entry date.
    applies_when: Use for a disciplined schedule of ongoing contributions to a suitable, diversified investment. It does not protect against losses, make an unsuitable asset sound, or guarantee better results than investing an available lump sum at once; keep the schedule and asset allocation consistent with cash needs and risk capacity.
    depends_on: [portfolio-diversification, defensive-vs-enterprising-investor-policy]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 5; Jason Zweig, commentary on chapters 5 and 8."

  - id: investment-adviser-due-diligence
    type: heuristic
    description: Assess an investment adviser’s competence, incentives, integrity, and fit before delegating financial decisions; advice does not remove the investor's responsibility to understand the mandate.
    applies_when: Clarify the adviser’s services, investment approach, fees, third-party compensation, conflicts, qualifications, disciplinary record, and communication practices. Independently verify public disclosures and credentials with relevant regulators or credentialing bodies, and reject pressure, secrecy, or promises of exceptional returns. Agree on goals, asset allocation, and an investment policy before implementation; revisit the relationship if advice or incentives diverge from that plan.
    depends_on: [defensive-vs-enterprising-investor-policy, investment-vs-speculation]
    source: "Benjamin Graham, The Intelligent Investor (2003 edition), chapter 10; Jason Zweig, commentary on chapter 10."

  - id: capital-gains-tax-deferral
    type: concept
    description: Holding an appreciated investment without selling can defer realization of a capital gain and the associated tax. The liability remains real, but a long deferral can preserve capital for compounding in the meantime.
    applies_when: |-
      - Tax on an appreciated holding may be deferred until sale, while dividends may trigger tax
        when paid; treatment depends on jurisdiction, account, and transaction.
      - For a business holding appreciated securities, assess when tax may be paid and how a sale
        or rate change affects the liability.
      - Deferral can support compounding but does not eliminate tax or make an investment sound;
        do not hold a deteriorating or materially overvalued investment solely to defer tax.
    source: "Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 2, 52, 55, and 57; Warren E. Buffett, Berkshire Hathaway shareholder letters for 1988-1989 and 1993, discussion of deferred taxes."

  - id: intrinsic-value-margin-of-safety
    type: concept
    description: Buying below a conservative estimate of intrinsic value creates a buffer for valuation error, but does not protect against permanent impairment of the business.
    applies_when: |-
      - Compare price with a conservative value range based on sustainable earning power or owner
        cash flow; a clear gap may be enough without a precise point estimate.
      - For fixed claims, assess multi-year coverage and the value cushion above debt. Keep
        forecasts conservative and supported by evidence.
      - A demonstrable margin provides room for error and adverse developments, not certainty or
        protection from permanent impairment.
      - Diversify across independently analyzed opportunities. Do not treat fixed P/E thresholds
        or historical earnings-yield spreads as universal.
    depends_on: [intrinsic-business-value, portfolio-diversification]
    source: "Benjamin Graham and David Dodd, Security Analysis, Sixth Edition (2008), chapter 1; Mary Buffett and David Clark, Warren Buffett and the Interpretation of Financial Statements (2008), chapters 2 and 55-57; Benjamin Graham, The Intelligent Investor (2003 edition), chapter 20 and commentary on chapter 20; Warren E. Buffett, Berkshire Hathaway shareholder letter for 1983, discussion of intrinsic business value."
