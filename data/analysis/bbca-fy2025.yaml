history_notes:
  '1998': FY2002 issuer highlights. Negative equity and loss. Opening balances unavailable.
  '1999': FY2002 issuer highlights. No standalone audited copy reviewed.
  '2000': FY2002 issuer highlights. BBCA listed during 2000.
  '2001': FY2002 consolidated comparative.
  '2004': FY2005 audited comparative.
  '2006': Rounded FY2006 highlights used for the history table.
  '2007': FY2008 audited comparative. No standalone FY2007 filing in the analysis dataset.
  '2010': FY2011 audited comparative.
  '2012': FY2013 audited comparative.
  '2013': As filed. FY2015 presents different restated FY2013 opening equity and assets. Historical returns around the
    restatement are indicative.
  '2014': FY2015 audited comparative. FY2013 opening data use the as-filed basis.
  '2016': FY2016 annual report financial statements. Audit opinion is on PDF p. 595.
  '2017': FY2018 audited comparative where available.
  '2020': FY2020 as filed. FY2021 compares fixed-asset acquisitions of IDR 2.28T with FY2020 as-filed IDR 2.67T. EPS
    uses the 2021 split basis.
  '2021': 1:5 stock split. Earlier reported EPS has been aligned to this share basis.
  '2023': Uses the dedicated FY2023 audited filing. Group profit and parent profit are distinct.
  '2024': FY2025 audited comparative. ROA and ROE use FY2023 closing balances.
  '2025': FY2025 audited filing. BCA reports no material prior-period effect from adoption of SFAS 117 and 109.
  2025-09: Nine months through September, comparative column in the 2026 report. September 2025 assets and equity come
    from the separate September 2025 filing.
  2026-09: Nine months through September. Unaudited.
  2026-10: October bank-only publication. The income page reports IDR 50.38T for a period ending October 31 and does
    not specify the start date. Excluded from the YTD comparison.
sections:
- title: FY2025 earnings and funding
  status: evidence_reviewed
  finding: Consolidated assets grew 9.5%, pretax income grew 4.5%, and net income grew 4.9%. The pretax increase of IDR
    3.04T reconciles to IDR 3.28T more net interest and sharia income and IDR 3.38T more other operating income, offset
    by IDR 1.21T lower net insurance income, IDR 1.98T higher impairment expense, and IDR 0.43T higher other operating
    expenses. Consolidated loans grew 7.7%, corporate loans drove the largest increase, and bank-only NIM slipped 0.1
    percentage point. CASA gained 2.2 percentage points of consolidated deposits. Stronger deposit mix and lower headline
    NPL coincided with materially higher impairment charges.
  sources:
  - balance
  - income
  - loans
  - ar
  - ratios
- title: FY2025 cash and capital
  status: evidence_reviewed
  finding: Operating cash rose from IDR 53.82T to 77.51T. Relative to 2024, customer deposit cash flows contributed IDR
    83.72T more and loan cash outflows were IDR 36.06T smaller. The reverse repo line moved IDR 95.48T in the other direction.
    These are the largest drivers of the operating cash move. The combined activity subtotal plus FX moved cash from
    IDR 85.48T to 87.55T in 2025. Funding includes temporary syirkah deposits, which are shown separately from liabilities
    in the audited balance sheet. Including them explains why the annual report’s leverage is higher than the YAML ratio.
  sources:
  - cash
  - balance
  - ratios
  - car
- title: Shareholder results and valuation
  status: evidence_reviewed
  finding: BBCA’s closing price fell from IDR 9,675 in 2024 to IDR 8,075 in 2025 while rounded basic EPS rose from IDR
    445 to 467. The year-end price fell about 16.5% before dividends. BCA’s annual report lists FY2025 P/B of 3.8× and
    book value of IDR 2,288 per share. Recomputing with the audited equity and closing shares excluding treasury gives
    about 3.53×. The published multiple does not reconcile to the stated price and book value. Calendar 2025 paid dividends
    were IDR 305 per share. The separately reported FY2025 payout was IDR 336 per share, including the IDR 281 final
    dividend paid in April 2026.
  sources:
  - price
  - equity
  - div
  - agm
  - bps
- title: Dividend valuation assumptions
  status: evidence_reviewed
  finding: The five-year dividend discount scenarios use FY2025 dividend per share as the starting point. Growth for
    years 1–5 is 3%, 6%, or 9%. Terminal growth is 2%, 3%, or 4% and cost of equity is 12%, 11%, or 10%, respectively.
    Model inputs are assumptions. The value uses the FY2025 payout confirmed in March 2026, so the comparison to the
    FY2025 closing price is retrospective.
  sources:
  - agm
  - price
  - car
  gap: The scenarios hold dividend growth exogenously. They do not forecast payout restrictions or model capital, funding,
    credit costs, and retained earnings jointly.
- title: September 2026 versus September 2025
  status: evidence_reviewed
  finding: Consolidated closing assets increased 6.7% year over year. Nine-month consolidated profit increased 4.2%,
    from IDR 43.41T to 45.24T. Closing gross loans and financing reached about IDR 1,063T, up 12.6% over September 2025,
    and corporate loans reached IDR 528.1T. BCA reported September loan at risk of 4.6% and NPL of 1.8%. The October
    bank-only balance sheet is shown separately.
  sources:
  - q25
  - interim
  - qpress
  - oct
rules:
  gross-margin:
    status: not_applicable
    finding: BBCA earns a spread on lending and funding, plus fees and other income. Bank-only NIM narrowed from 5.8%
      to 5.7%. Track NIM alongside fees, credit costs, and operating efficiency.
    sources:
    - income
    - ratios
  cost-of-goods-sold:
    status: not_applicable
    finding: The consolidated income statement reports interest, insurance, operating expenses and credit impairment.
      The inventory cost formula does not describe those activities.
    sources:
    - income
    - balance
  gross-profit:
    status: not_applicable
    finding: Consider IDR 85.55T of net interest and sharia income and IDR 26.31T of other operating income separately.
      They have different drivers and are not an inventory-based gross profit.
    sources:
    - income
  operating-profit:
    status: not_applicable
    finding: Interest is part of core banking income. The pretax bridge uses net interest and sharia income, net insurance,
      other income, impairment and operating expenses.
    sources:
    - income
    - ratios
  sga-to-gross-profit:
    status: not_applicable
    finding: BCA’s personnel and administrative expenses support recurring banking operations. Its bank-only cost-to-income
      ratio was 30.7%, versus 31.3% in 2024.
    sources:
    - income
    - ratios
  rd-to-gross-profit:
    status: not_applicable
    finding: IT and digital investment contribute to transaction capacity, but the consolidated statement lacks a separate
      comparable R&D and gross-profit pair.
    sources:
    - income
    - ar
  depreciation-to-gross-profit:
    status: not_applicable
    finding: Fixed assets are depreciated and include right-of-use assets. Review the asset note and use a multi-year
      purchases-to-earnings comparison for the capital burden.
    sources:
    - leases
    - cash
  interest-to-operating-income:
    status: not_applicable
    finding: Funding interest is a banking input cost. Compare interest expense with earning assets, deposit mix, and
      NIM. Stress deposit repricing and credit costs together.
    sources:
    - income
    - funding
    - ratios
  net-profit-margin:
    status: missing_inputs
    finding: The banking proxy uses group net income divided by net interest and sharia income plus other operating income.
      See its FY2024 and FY2025 results above.
    sources:
    - income
    gap: There is no approved generic revenue denominator in the statement data. The proxy excludes separately reported
      insurance income.
  earnings-per-share:
    status: calculated
    finding: Rounded basic EPS rose from IDR 445 to 467, about 5%. Parent-attributable profit rose 4.9% while the weighted
      share count fell about 0.024%, so earnings drove almost all EPS growth. The history aligns EPS to the October 2021
      share basis.
    sources:
    - income
    - eps
    - split
    - buyback
  price-earnings-ratio:
    status: calculated
    finding: The retrospective earnings multiple used the calendar year-end close and audited basic EPS. The multiple
      fell from about 21.7× in 2024 to 17.3× in 2025 as EPS grew and the share price fell.
    sources:
    - price
    - eps
  price-to-book-ratio:
    status: calculated
    finding: Common book value comes from parent equity and closing common shares excluding treasury stock. The annual
      report publishes 3.8×. Its printed price and book value per share imply roughly 3.53×.
    sources:
    - balance
    - equity
    - price
    - buyback
    gap: The cause of the published P/B discrepancy remains unresolved.
  dividend-yield:
    status: calculated
    finding: Calendar 2025 payments were IDR 250 final for FY2024 and IDR 55 interim for FY2025. The trailing yield uses
      those payments and the FY2025 close. The FY2025 final payment belongs to the 2026 cash calendar.
    sources:
    - price
    - div
    - agm
  dividend-policy-as-cash-flow-signal:
    status: evidence_reviewed
    finding: Fiscal DPS rose from IDR 300 to 336 and the EPS payout went from about 67% to 72%. Compare this with retained
      earnings and capital after a credit stress. The 2025 cash-flow statement includes payments for different fiscal
      years.
    sources:
    - agm
    - div
    - cash
    - capital
  earnings-yield-on-original-cost:
    status: requires_investor_input
    finding: The catalog calculation needs the investor’s original cost and normalized EPS. BCA’s disclosed splits allow
      the two per-share amounts to be aligned.
    sources:
    - split
    - eps
    gap: No purchase price or date was provided.
  effective-tax-rate:
    status: calculated
    finding: Effective tax fell from 19.59% to 19.22%. Cash tax paid was IDR 12.51T against IDR 13.70T of recognized
      expense. Use the tax note to reconcile current and deferred charges before drawing a conclusion.
    sources:
    - income
    - tax
  net-receivables-to-sales:
    status: not_applicable
    finding: Loans are earning assets, while banking revenue includes spread and fees. Use loan growth, gross NPL, loan
      at risk and allowance movements to investigate collection quality.
    sources:
    - loan
    - credit
    - ratios
  customer-concentration-risk:
    status: evidence_reviewed
    finding: Corporate lending contributed IDR 49.44T of bank-only segment growth. Review sector and single-name exposures
      alongside depositor concentration.
    sources:
    - loans
    - credit
    - funding
    gap: A complete distribution of beneficial borrowers and individual depositor concentrations was not established.
  customer-financing-risk:
    status: not_applicable
    finding: Customer lending is BBCA’s principal business activity. Consumer financing and leases are credit exposures
      to monitor through underwriting, collateral, and provisions. The seller-financing revenue test is outside the core
      banking model.
    sources:
    - loan
    - subs
    - credit
  working-capital:
    status: not_applicable
    finding: The consolidated balance sheet is organized around banking asset and funding categories. Use maturity disclosures,
      liquidity buffers and stable funding to assess short-term coverage.
    sources:
    - balance
    - liquidity
    - ratios
  net-current-asset-value:
    status: not_applicable
    finding: Reported current-asset liquidation value cannot be isolated using the catalog formula. Loan recoveries,
      deposit priority, and resolution constraints require asset and claim analysis.
    sources:
    - balance
    - liquidity
  current-ratio:
    status: not_applicable
    finding: Use disclosed LCR and NSFR rather than recasting banking assets and deposits into industrial current-ratio
      inputs. The FY2025 bank-only LCR disclosure was 310.8%.
    sources:
    - liquidity
    - ratios
  quick-ratio:
    status: not_applicable
    finding: Excluding inventory would do little to measure BBCA’s liquidity. Availability of eligible liquid assets,
      deposit outflows and collateral needs are the relevant disclosures.
    sources:
    - balance
    - liquidity
    - ratios
  total-liabilities-to-equity:
    status: calculated
    finding: Audited liabilities exclude separately presented temporary syirkah deposits. Adding IDR 10.63T of syirkah
      deposits to FY2025 liabilities reconciles to about 4.63×, the scope implied by the annual highlights. Bank leverage
      also needs regulatory capital and liquidity context.
    sources:
    - balance
    - ratios
  return-on-assets:
    status: calculated
    finding: Uses consolidated group net income and average opening and closing assets. Assets expanded faster than profit
      in FY2025. The annual report’s regulatory bank-only ratio has a separate scope.
    sources:
    - balance
    - income
    - ratios
  return-on-equity:
    status: calculated
    finding: Uses parent-attributable earnings and average parent equity. BCA’s reported bank-only ROE uses average Tier
      1 capital, so keep that ratio separate when comparing returns.
    sources:
    - balance
    - income
    - ratios
  return-on-invested-capital:
    status: not_applicable
    finding: Deposits and interest are integral to banking operations. The catalog’s industrial operating-capital split
      is unsuitable. Use ROA, common-equity ROE, and returns relative to regulatory capital needs.
    sources:
    - balance
    - income
    - capital
  capital-expenditure-to-net-earnings:
    status: calculated
    finding: Sum fixed-asset purchases as outflow magnitudes and group earnings across FY2016–FY2025. FY2020 uses the
      statement as filed. FY2021 reports a different FY2020 comparative amount.
    sources:
    - cash
    - cash20
    - cash21
    gap: The rollup excludes right-of-use acquisitions and does not identify the maintenance portion.
  owner-earnings:
    status: requires_manual_estimate
    finding: The disclosed fixed-asset purchases measure only part of maintaining a bank. Reinvestment also includes
      capital to support lending and credit losses. Bank regulatory capital and distributable earnings inform an estimate.
    sources:
    - cash
    - leases
    - capital
    gap: A sustainable maintenance-capex and incremental-capital estimate is required.
  net-change-in-cash:
    status: calculated
    finding: FY2025 activity flows sum to IDR 2.109T. A negative IDR 0.042T FX effect makes the increase in closing cash
      about IDR 2.067T. Both fiscal-year reconciliations close to zero in IDR millions.
    sources:
    - cash
  income-statement:
    status: evidence_reviewed
    finding: The pretax bridge closes. Other operating income and the interest spread lifted earnings, while larger asset
      impairments and lower net insurance income reduced the gain.
    sources:
    - income
  income-before-tax:
    status: evidence_reviewed
    finding: Pretax profit increased from IDR 68.22T to 71.26T. Review the interest, noninterest, insurance and impairment
      lines separately to determine which changes are likely to recur.
    sources:
    - income
    - tax
  balance-sheet:
    status: evidence_reviewed
    finding: Assets were IDR 1,586.83T, with group equity of IDR 281.69T. Liabilities, temporary syirkah deposits and
      equity sum to total assets. Parent equity is a separate amount for common holders.
    sources:
    - balance
    - funding
  preferred-stock-priority:
    status: not_applicable
    finding: This assessment concerns BBCA common shares. The capital note provides ordinary-share and treasury details.
      Preferred claim priority would require the rights of an identified issue.
    sources:
    - equity
  convertible-security-analysis:
    status: requires_security_terms
    finding: Basic EPS and the common-share note establish the starting capital structure. A convertible valuation needs
      an identified instrument and its strike, conversion, ranking and call terms.
    sources:
    - equity
    - eps
  warrant-bearing-senior-security:
    status: requires_security_terms
    finding: Common-share and regulatory-capital disclosures establish context. A warrant-bearing bond assessment requires
      a specific offering and terms for both the claim and warrant.
    sources:
    - equity
    - capital
  current-asset-cycle:
    status: not_applicable
    finding: The banking cycle is driven by deposit funding, lending, collection, and maturity transformation. Track
      it with funding flows and cash maturity disclosures.
    sources:
    - balance
    - cash
    - liquidity
  unrecognized-intangible-value:
    status: evidence_reviewed
    finding: A large transaction and deposit franchise can have value beyond its balance sheet carrying amounts. CASA
      represented 83.7% of group third-party funds. Value depends on customer retention and continued funding advantage.
    sources:
    - ar
    - ratios
    gap: No standalone franchise value has been measured.
  replacement-value-analysis:
    status: requires_manual_estimate
    finding: Rebuilding the transaction network, customer relationships and underwriting infrastructure would require
      operating scale and time. Branches, accounts and deposit mix give observable anchors.
    sources:
    - ar
    - ratios
    gap: The filings do not quantify entry costs and time for a comparable new bank.
  intrinsic-business-value:
    status: scenario
    finding: The dividend discount estimates above use the confirmed FY2025 payout. Their range is driven by dividend
      growth and the spread between cost of equity and terminal growth.
    sources:
    - agm
    - car
    - price
    gap: Projected payouts depend on earning power and distributable capital.
  cash-flow-statement:
    status: evidence_reviewed
    finding: Deposit inflows, loan deployment, and reverse-repo movements explain much of the FY2025 operating cash change.
      Read it alongside investing in securities, treasury purchases and cash dividends.
    sources:
    - cash
  primary-filings-for-financial-analysis:
    status: evidence_reviewed
    finding: The history distinguishes issuer highlights, comparative columns, detailed audited statements and interim
      releases. The 2020 capex comparison and FY2025 P/B disagreement illustrate why source cells matter.
    sources:
    - early
    - fy07
    - balance
    - income
    - cash
  durable-competitive-advantage:
    status: evidence_reviewed
    finding: Consolidated CASA of 83.7%, large account numbers, and improving bank-only efficiency support a funding
      and transaction advantage hypothesis.
    sources:
    - ar
    - ratios
    - loans
    - bri
    - mandiri
    gap: Test comparable funding costs and margins across rate cycles before calling the advantage durable.
  industry-growth-vs-investor-returns:
    status: evidence_reviewed
    finding: BBCA’s loans expanded 7.7%, while its share price fell in 2025. The calendar shareholder return also includes
      dividends. One issuer and one year cannot establish an industry return relationship.
    sources:
    - loans
    - price
    - div
  brand-based-product-advantage:
    status: evidence_reviewed
    finding: The annual report records more than 43 million accounts alongside strong CASA. That signals distribution
      scale. It cannot isolate brand from convenience, switching costs or network effects.
    sources:
    - ar
    - ratios
  institutional-vs-people-specific-service:
    status: evidence_reviewed
    finding: Branch and digital banking channels serve a broad account base. Executive succession and operating controls
      matter, while the filings provide limited data on relationship-manager attrition and customer portability.
    sources:
    - ar
    - governance
  low-cost-buyer-seller-model:
    status: evidence_reviewed
    finding: BBCA’s analog is low-cost funding that supports competitively priced lending. The CASA mix improved while
      NIM fell slightly. Check loan and deposit repricing before attributing spread changes to the franchise.
    sources:
    - funding
    - ratios
  operating-leverage-sensitivity:
    status: evidence_reviewed
    finding: Other operating expenses grew about 1.2%, below growth in pretax income. Provisions rose much faster, which
      shows why a bank stress case must vary impairments and spreads as well as overhead.
    sources:
    - income
    - ratios
  business-quality-before-valuation:
    status: evidence_reviewed
    finding: BBCA’s funding mix, loan quality and capital support an operating assessment. The historical multiple and
      dividend scenarios price the common stock separately.
    sources:
    - ar
    - ratios
    - capital
    - price
  circle-of-competence:
    status: investor_framework
    finding: A BBCA thesis should explain deposit repricing, credit provisioning, capital and treasury risk. The statements
      provide the evidence. Whether the analyst understands the exposures requires judgment.
    sources:
    - income
    - capital
    - liquidity
  investment-vs-speculation:
    status: investor_framework
    finding: A BBCA investment case needs earnings, risk and valuation assumptions that can be checked when results change.
      A price move alone leaves those assumptions untested.
    sources:
    - price
    - income
  security-economic-risk-classification:
    status: investor_framework
    finding: BBCA common equity has a residual claim. Bank deposits and issued debt have different priorities and exposure.
      Classification of a specific senior issue requires its terms.
    sources:
    - equity
    - funding
    - capital
  analysis-effort-proportionality:
    status: investor_framework
    finding: The maturity and credit notes matter more when an investment has a large size or depends on a narrow margin
      of safety.
    sources:
    - credit
    - liquidity
    gap: The position size and decision constraints are investor inputs.
  investor-risk-calibration:
    status: requires_investor_input
    finding: BBCA’s 2025 price change and bank capital figures can frame downside. The appropriate exposure depends on
      the investor’s loss capacity and horizons.
    sources:
    - price
    - capital
  defensive-vs-enterprising-investor-policy:
    status: requires_investor_input
    finding: The filings support detailed active research. Assessing fit requires a portfolio policy, benchmark and a
      limit on single-bank exposure.
    sources:
    - price
    - ar
  new-issue-valuation-risk:
    status: not_applicable
    finding: FY2025 valuation uses already listed common stock. The share listing history and buyback are relevant capital
      actions. A new issue review requires an issue price and prospectus.
    sources:
    - split
    - buyback
  special-situation-analysis:
    status: requires_security_terms
    finding: The disclosed buyback and cash dividend are capital-allocation events. An event-driven return would require
      a defined transaction, consideration, timing and completion conditions.
    sources:
    - buyback
    - agm
  distressed-security-recovery-analysis:
    status: not_applicable
    finding: This is a going-concern common-stock assessment. A restructuring recovery study would require an identified
      distressed claim, enforceable priorities, asset recoveries and resolution timing.
    sources:
    - capital
    - liquidity
    - equity
  maximum-valuation-for-senior-issues:
    status: requires_security_terms
    finding: The report assesses common equity. A senior security ceiling would require the issue’s rights and the economic
      value available to all claimants.
    sources:
    - capital
    - liquidity
  historical-strategy-decay:
    status: requires_external_data
    finding: BBCA’s observed annual history illustrates regime changes. Testing a market strategy requires a time-stamped
      eligible universe, delistings, transaction costs and out-of-sample results.
    sources:
    - early
    - split
    - price
  real-return-after-inflation:
    status: calculated
    finding: Use the FY2024 and FY2025 year-end closes, cash dividends during calendar 2025 and national December-to-December
      CPI. The resulting return is before taxes and assumes no reinvestment.
    sources:
    - price
    - div
    - bps
  inflation-and-equity-earnings:
    status: evidence_reviewed
    finding: Rounded basic EPS rose about 4.9% versus 2.92% December-to-December CPI. Compare several years and watch
      both deposit repricing and borrower affordability.
    sources:
    - eps
    - bps
    - ratios
  bond-price-and-purchasing-power-risk:
    status: investor_framework
    finding: The December 24 sovereign yield and December CPI provide historical context. A holding-period bond return
      would depend on its coupon, duration, price moves and cash flows.
    sources:
    - bi
    - bps
  market-return-components:
    status: evidence_reviewed
    finding: 2025 basic EPS rose while P/E and price declined. Cash distributions cushioned the price decline and inflation
      reduced purchasing-power return further.
    sources:
    - price
    - div
    - eps
    - bps
  stock-bond-relative-valuation:
    status: evidence_reviewed
    finding: FY2025 retrospective earnings yield was about 5.8%, trailing cash yield about 3.8%, and the December 24
      10-year SBN benchmark yield was 6.13%. The dates, claim risk, and yield definitions differ.
    sources:
    - price
    - eps
    - div
    - bi
    gap: A normalized earnings series and investor after-tax bond cash flows would be needed for a decision.
  survivorship-bias-in-market-history:
    status: investor_framework
    finding: BBCA’s return and recovery history is for a surviving issuer. The FY1998 loss illustrates stress but cannot
      estimate returns for banks that failed or delisted.
    sources:
    - early
    - split
  market-price-vs-business-economics:
    status: evidence_reviewed
    finding: Between the 2024 and 2025 closes the price fell 16.5% while profit and EPS grew. Lower pricing relative
      to earnings explains the difference arithmetically. The causes of repricing are uncertain.
    sources:
    - price
    - eps
    - income
  durable-advantage-compounding:
    status: evidence_reviewed
    finding: Group parent equity and earnings have risen across several years. A higher payout reduces the fraction retained.
      Establish durability by comparing incremental returns on retained capital over a credit cycle.
    sources:
    - ar
    - ratios
    - agm
  look-through-earnings:
    status: requires_manual_estimate
    finding: The filing already consolidates controlled subsidiaries and includes a separate bank-only appendix. Review
      material nonconsolidated investments before adding any share of retained earnings.
    sources:
    - subs
    - bank
    gap: Comparable retained results for material investees and hypothetical distribution taxes are needed.
  subsidiary-earnings-reconciliation:
    status: evidence_reviewed
    finding: FY2025 group net income was IDR 57.56T, of which IDR 57.54T was attributable to the parent. The difference
      measures noncontrolling interests. Isolating subsidiary contribution requires the parent-only statements, intragroup
      eliminations and subsidiary results.
    sources:
    - income
    - subs
    - bank
  financial-consistency-as-durability-evidence:
    status: evidence_reviewed
    finding: The decade series shows nominal growth in earnings and assets, a 2020 profit dip, and subsequent recovery.
      Deposits, capital and recurring returns are better bank checks than the catalog’s industrial gross-margin benchmark.
    sources:
    - ar
    - ratios
    - early
  inventory-growth-vs-sales:
    status: not_applicable
    finding: Loan book growth is the bank’s balance sheet exposure to track. Compare origination and sector concentration
      with impairment and receivable quality.
    sources:
    - balance
    - loan
  goodwill-and-acquisition-quality:
    status: evidence_reviewed
    finding: Review acquired and reorganized subsidiaries separately from organically expanded lending. Balance sheet
      intangibles and any goodwill impairment should be compared with purchase consideration and post-acquisition cash
      generation.
    sources:
    - subs
    - policy
    - asset
    gap: Transaction-level returns have not been established.
  long-term-investments-as-capital-allocation:
    status: evidence_reviewed
    finding: Investment securities and other placements are meaningful uses of bank funds. Review duration, credit and
      market value alongside liquidity needs before treating these holdings as surplus corporate investments.
    sources:
    - balance
    - fair
    - cash
  share-repurchase-value:
    status: evidence_reviewed
    finding: BCA ended FY2025 with 262.0 million treasury shares and the cash-flow statement records IDR 2.15T of treasury
      purchases. The share-count reduction is observable. Value creation depends on purchase prices relative to conservative
      intrinsic value and capital needs.
    sources:
    - buyback
    - equity
    - cash
    - price
  stock-based-compensation-cost:
    status: evidence_reviewed
    finding: The listing history records earlier MSOP issues. Weighted shares and current compensation disclosures inform
      dilution and remuneration review.
    sources:
    - split
    - governance
    - eps
    gap: A current grant-by-grant dilution schedule was not established.
  institutional-imperative:
    status: evidence_reviewed
    finding: Buybacks, distribution policy and remuneration are observable board decisions. Assess whether their timing
      follows capital needs and per-share economics. The reports do not establish management motive.
    sources:
    - governance
    - buyback
    - agm
  management-owner-alignment:
    status: evidence_reviewed
    finding: Review the disclosed board remuneration, treasury repurchases and payout decisions together. Consider incentives
      and whether retained capital is deployed above its required return.
    sources:
    - governance
    - buyback
    - agm
  lollapalooza-bias-combination:
    status: investor_framework
    finding: Franchise reputation, a falling share price, and a dividend increase can reinforce a bullish interpretation.
      Test each claim against funding costs, credit losses and independently chosen valuation assumptions.
    sources:
    - ar
    - price
    - agm
  debt-maturity-and-refinancing-risk:
    status: evidence_reviewed
    finding: Read contractual maturities against the behavior of demand and savings deposits. LCR and NSFR supplement
      maturity gap disclosures. Funding stresses can combine deposit outflows, collateral needs and reduced market access.
    sources:
    - funding
    - liquidity
    - capital
  lease-obligations-as-fixed-charges:
    status: evidence_reviewed
    finding: The FY2025 notes report right-of-use assets and related liabilities. Cash-flow purchases of right-of-use
      assets are separate from fixed-asset purchases for the capex ratio. Review payment maturities before estimating
      fixed commitments.
    sources:
    - leases
    - cash
  contractual-guarantee-credit-analysis:
    status: evidence_reviewed
    finding: BCA discloses bank guarantees among off-balance-sheet exposures. Their credit loss and recovery depend on
      draw conditions, collateral and counterparties. A guarantee claim requires its individual contract.
    sources:
    - guarantee
    - credit
  subsidiary-credit-analysis:
    status: requires_security_terms
    finding: The list of subsidiaries and the debt disclosures identify potential issuers. A bondholder needs the named
      issuer and enforceable support terms before attributing parent liquidity to the claim.
    sources:
    - subs
    - funding
    - guarantee
  credit-covenant-quality-and-remedies:
    status: requires_security_terms
    finding: Funding and commitment notes identify exposures, while remedies and covenants depend on a specific instrument
      and governing documents.
    sources:
    - funding
    - guarantee
  ongoing-credit-supervision:
    status: investor_framework
    finding: Refresh credit losses, liquidity and regulatory capital with interim filings. Escalate material funding
      and credit changes to a specific issue review when monitoring debt.
    sources:
    - credit
    - liquidity
    - capital
    - interim
  regulated-utility-regulatory-risk:
    status: not_applicable
    finding: BBCA is regulated as a deposit-taking bank. Capital, liquidity and loan supervision are the relevant constraints.
      Utility cost-recovery and allowed-rate rules address another industry.
    sources:
    - capital
    - risk
  derivative-counterparty-and-contagion-risk:
    status: evidence_reviewed
    finding: Trading and market-risk notes identify derivatives and valuations. Assess net exposures, collateral calls
      and counterparty concentration under stress.
    sources:
    - fair
    - credit
    - liquidity
    gap: A counterparty-level netting and collateral schedule was not established.
  liquidity-as-financial-optionality:
    status: evidence_reviewed
    finding: Reported liquid assets and LCR indicate capacity to absorb near-term shocks. Stable funding and the composition
      of deposits matter alongside cash. Annual flows do not prove availability during a run.
    sources:
    - liquidity
    - ratios
    - cash
  borrower-repayment-capacity:
    status: evidence_reviewed
    finding: Use portfolio grading, credit-loss allowances, and loan at risk to assess underwriting. Corporate loan growth
      makes sector and obligor monitoring more valuable. Individual debt-service capacity needs borrower financials.
    sources:
    - loan
    - credit
    - loans
  insurance-underwriting-cycle-discipline:
    status: evidence_reviewed
    finding: BCA Life and BCA Insurance have distinct activities. BCA Life reports about IDR 2.00T of premiums and IDR
      465.28B of claims and benefits in FY2025. BCA Insurance reported IDR 287.2B of net insurance service results versus
      IDR 279.9B for its restated 2024 comparison. That rise establishes a two-year change.
    sources:
    - subs
    - life
    - insurance
    - income
    gap: A full underwriting cycle and claims-development history were not established.
  insurance-float-cost:
    status: requires_manual_estimate
    finding: This formula applies at the insurance subsidiary level. Group temporary syirkah deposits are a different
      instrument.
    sources:
    - life
    - insurance
    - subs
    gap: An underwriting-only result and compatible opening and closing float are required.
  insurance-float-economics:
    status: evidence_reviewed
    finding: The insurer disclosures distinguish policy obligations, asset backing and solvency. Review claims timing
      and investment risk at each insurer. Keep insurance float separate from deposits at the bank.
    sources:
    - life
    - insurance
    - policy
  normalize-earnings-for-nonrecurring-items:
    status: evidence_reviewed
    finding: Fair-value trading income rose from IDR 2.85T to 4.01T, while impairments rose to IDR 4.01T. Separate their
      drivers and recurrence before proposing adjustments. BCA says the new insurance standards had no material effect
      on prior amounts.
    sources:
    - income
    - policy
    - tax
    gap: No normalized EPS adjustment is assumed without a defensible recurring baseline.
  pre-tax-investment-comparison:
    status: evidence_reviewed
    finding: Use pretax income for operating comparisons. Sovereign yield is an investor return convention, so compare
      comparable before-tax yields and show differences in risk and expected growth.
    sources:
    - income
    - tax
    - bi
  portfolio-diversification:
    status: requires_investor_input
    finding: BBCA’s borrower diversification and the investor’s asset allocation are different questions. Measure the
      portfolio’s combined Indonesia, financial-sector and single-name exposure.
    sources:
    - credit
    - price
    gap: Holdings and weights were not provided.
  low-cost-index-fund-benchmark:
    status: requires_external_data
    finding: Compare BBCA total shareholder return with a dated, dividend-inclusive, investable index benchmark and disclosed
      fund costs.
    sources:
    - price
    - div
    gap: The analysis inputs contain BBCA distributions and closes but no matched investable fund return series.
  closed-end-fund-discount-to-nav:
    status: not_applicable
    finding: The historical BBCA valuation uses operating-company common book value. A closed-end fund discount requires
      a fund’s NAV per share.
    sources:
    - equity
    - price
  dollar-cost-averaging:
    status: requires_investor_input
    finding: A contribution plan would need dates, amounts, executions, dividends and the relevant split factors. Closing
      prices alone cannot replicate those purchases.
    sources:
    - price
    - split
    - div
  investment-adviser-due-diligence:
    status: investor_framework
    finding: These records describe BBCA and its board. Evaluating an investment adviser requires the adviser’s registration,
      track record, fees, conflicts and mandate.
    sources:
    - governance
  capital-gains-tax-deferral:
    status: requires_investor_input
    finding: The statements distinguish company tax and shareholder distributions. Investor treatment depends on domicile,
      account, cost basis, distributions, and the eventual sale.
    sources:
    - div
    - tax
  intrinsic-value-margin-of-safety:
    status: scenario
    finding: The comparison uses the conservative dividend value and FY2025 closing price shown above. At the modeled
      assumptions, the historical price sits above the conservative estimate.
    sources:
    - price
    - agm
    - capital
    gap: Other dividend and capital scenarios can change the range. An observed price gap is conditional on the model.
