rules:
  bank-credit-cost-ratio:
    status: partial
    finding: The bank-only loan impairment cost ratio is calculated for FY2018–FY2025 and 2025/2026 H1 and 9M YTD
      periods. The expense uses the loan-specific impairment line; the interim values are not annualized.
    gap: No opening/closing history was assembled before FY2017, and FY2026 full-year results have not yet been
      published.
    sources:
    - fy2018-credit
    - fy2025-credit
    - 2025-06-credit
    - 2025-09-credit
    - 2026-09-credit
    - ojk-bank-publications
  bank-npl-coverage-ratio:
    status: partial
    finding: The accounting loan-loss allowance divided by gross NPL classified under prudential rules is calculated
      as a bank-only proxy from FY2018 through September 2026. The dates, units and reporting entity match; the
      filing set does not establish an identical regulatory loan perimeter, so the percentage is not an exact regulatory
      coverage ratio.
    gap: Earlier periods and the independent OJK company-level reconciliation remain unreviewed; collateral recovery
      and write-off timing are not captured.
    sources:
    - fy2018-credit
    - 2026-09-npl
    - ojk-bank-publications
    - fy2025-npl
    - 2026-09-npl
  bank-deposit-cost-ratio:
    status: partial
    finding: The ratio uses consolidated interest expense on customer deposits divided by average consolidated customer
      deposits for FY2018–FY2025, 2025 H1/9M, and 2026 Q1/H1/9M. Sharia deposits and sharia expense are reported
      separately and excluded from both sides.
    gap: Earlier history and an independent OJK company-level reconciliation remain unreviewed; the ratio is not
      the bank’s all-in funding cost because other funding is excluded.
    sources:
    - fy2018-deposit-cost
    - fy2025-deposit-cost
    - 2025-06-deposit-cost
    - 2026-09-deposit-cost
    - ojk-bank-publications
  bank-deposit-franchise-resilience:
    status: partial
    finding: BCA reported CASA of 85.6% of total funding at September 2026. Mandiri, BNI and BRI provide issuer-reported funding mix comparisons with scope differences.
    gap: Historical deposit repricing by segment, large depositor concentration, runoff and matched peer cost definitions remain gaps.
    sources: [bank-bca-sep26-funding, bank-peer-mandiri, bank-peer-bni, bank-peer-bri, bank-bi-rate]
  bank-underwriting-and-concentration:
    status: partial
    finding: The note discloses gross loan-stage shares, transfers, write-offs and sector balances. BCA discloses a three-year deferral and conditional malus or clawback for material risk takers.
    gap: Single-name and correlated borrower exposures, matched cohort migration, and use of remuneration adjustments remain open.
    sources: [bank-loan-stages, bank-fy25-remuneration, 2026-09-npl]
  bank-capital-loss-resilience:
    status: partial
    finding: The September 2026 KM1 table separates CET1, RWA, specific buffer requirements and available CET1 after minimum requirements. The separate scenario inputs support an illustrative earnings and capital bridge.
    gap: Bank-specific binding distribution constraints and a full regulatory deductions and loss absorption bridge still need review.
    sources: [bank-2026-09-capital-risk, bank-imf-stress, bank-ojk-disclosures]
  bank-rate-liquidity-and-contingent-risk:
    status: partial
    finding: FY2025 adds disclosed consolidated EVE and NII sensitivity with their respective denominators. The scenario model separates repricing on retained balances from replacement funding for runoff.
    gap: The September 2026 capital report does not contain a matching IRRBB table. Observed repricing betas and depositor behavior remain open.
    sources: [bank-fy25-irrbb, bank-2026-09-capital-risk, bank-bi-rate]
  bank-through-cycle-earnings-and-value:
    status: partial
    finding: A capital-constrained dividend model and a residual income cross-check use the same five-year equity earnings path. Reproducible scenarios vary earnings and RWA separately.
    gap: Normalized ROE and stress inputs are illustrative. Verified through-cycle common earnings and earnings on discretionary retained capital remain open.
    sources: [bank-buffett-retention, bank-equity-valuation, bank-2026-09-capital-risk, bank-loan-stages]
  bank-stage-2-loan-share:
    status: calculated
    finding: Gross Stage 2 loans were 2.02% of gross staged loans at December 2025 and 2.03% at September 2026.
    gap: A longer matched series and cohort-level migration analysis are still needed.
    sources: [bank-loan-stages]
  bank-stage-3-loan-share:
    status: calculated
    finding: Gross Stage 3 loans rose from 1.67% to 1.79% of gross staged loans across the same two reporting dates.
    gap: Accounting Stage 3 is a separate series from prudential NPLs.
    sources: [bank-loan-stages]
input_conflicts: []
